<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suffix Lab</title><style>:root{--i:#18211e;--m:#707773;--p:#f3f0e8;--c:#fbfaf6;--l:#d8d5cc;--g:#285e50;--a:#4f6874;--f:#fff3c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif}header{padding:12px 4vw;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:10px;align-items:center}a{color:inherit;text-decoration:none}nav{display:flex;gap:7px;flex-wrap:wrap}nav a,button{border:1px solid var(--l);background:var(--c);border-radius:18px;padding:9px 12px;font:inherit}main{width:min(1050px,92vw);margin:auto;padding:28px 0 60px}.hero{text-align:center}.hero h1{font:clamp(42px,7vw,72px)/1 Georgia,serif;margin:12px}.hero p,.muted{color:var(--m);line-height:1.7}.bar{display:flex;gap:8px;overflow-x:auto;margin:24px 0 14px}.bar button{white-space:nowrap}.bar .on{background:var(--i);color:#fff}.box{border:1px solid var(--l);background:var(--c);border-radius:22px;padding:20px;margin-top:14px}.big{font:46px Georgia,serif;color:var(--a)}.warn{border-left:4px solid var(--a);background:#edf0f2;padding:12px;margin-top:12px;font-size:12px}.grid,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.verb{text-align:left;border-radius:16px}.verb.on{outline:3px solid var(--f)}.ru{font:28px Georgia,serif}.card{border:1px solid var(--l);background:white;border-radius:14px;padding:14px}.card small{display:block;color:var(--m);font-size:9px;margin-bottom:5px}.sentence{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:15px;padding-top:15px;border-top:1px solid var(--l)}@media(max-width:760px){header{align-items:flex-start}.grid,.cards{grid-template-columns:1fr}.hero h1{font-size:48px}}</style></head><body><header><a href="index.html"><b>Я Russian Structure Lab</b><br><small>SUFFIX LAB</small></a><nav><a href="index.html">← Learn</a><a href="aspect-lab.html">🔄 Aspect</a><a href="prefix-lab.html">🧭 Prefix</a></nav></header><main><section class="hero"><div>🧬 SUFFIX LAB</div><h1>Suffixes reshape the verb.</h1><p>接尾語・語幹変化が、aspect・反復性・一回性などにどう関わるかを比較します。ここでも「接尾語 = 意味」という単純化はしません。</p></section><div class="bar" id="bar"></div><section class="box"><div class="big" id="big"></div><h2 id="title"></h2><div class="muted" id="lead"></div><div class="warn" id="warn"></div></section><div class="grid" id="grid"></div><section class="box"><h2 class="ru" id="word"></h2><button id="sound">🔊 word</button><div class="cards"><div class="card"><small>RELATED FORM</small><div id="base"></div></div><div class="card"><small>SUFFIX / STEM CHANGE</small><div id="contrib"></div></div><div class="card"><small>ASPECTUAL ROLE HERE</small><div id="whole"></div></div></div><div class="sentence"><button id="exSound">🎧</button><span class="ru" id="exRu"></span><span class="muted" id="exJp"></span></div></section></main><script>const S=[{s:'-ывать / -ивать',t:'secondary imperfective formation',l:'Often forms an imperfective partner from a prefixed perfective verb.',w:'This pattern is productive, but not every verb uses it and stem alternations are common.',i:[['записывать','записать','-ывать with stem adjustment','imperfective counterpart: process/repetition','Я записываю номер.','私は番号を書き留めている。'],['переписывать','переписать','-ывать','imperfective counterpart to rewrite repeatedly/in process','Я переписываю текст.','私は文章を書き直している。'],['подписывать','подписать','-ывать','imperfective counterpart to signing as process/repeated action','Он подписывает документы.','彼は書類に署名している。']]},{s:'-ва-',t:'imperfective extension in some verb families',l:'A -ва- element appears in several imperfective partners and preserves an ongoing/repeated viewpoint.',w:'Do not treat -ва- as a universal imperfective marker; it belongs to particular lexical families.',i:[['давать','дать','-ва- in the imperfective stem','repeated/general giving','Он часто даёт советы.','彼はよく助言をする。'],['вставать','встать','expanded imperfective stem with -ва-/alternation','habitual or unfolding getting up','Я встаю рано.','私は早く起きる。'],['узнавать','узнать','-ва- in imperfective partner','process/repeated recognition or learning','Я узнаю много нового.','私は多くの新しいことを知る。']]},{s:'-ну-',t:'single bounded / semelfactive tendency in some verbs',l:'In some verb families -ну- helps form a single, punctual event.',w:'-ну- does not automatically mean perfective, and not every -нуть verb is a simple one-time counterpart.',i:[['прыгнуть','прыгать','-ну-','one bounded jump','Он прыгнул.','彼は一度跳んだ。'],['крикнуть','кричать','-ну-','one bounded cry/shout','Она крикнула.','彼女は一声叫んだ。'],['махнуть','махать','-ну-','one bounded wave/motion','Он махнул рукой.','彼は手をひと振りした。']]},{s:'stem alternation',t:'aspect can be carried by a whole family, not one suffix',l:'Some pairs change stems or use historically different formations. The app should show the relation without inventing a fake affix rule.',w:'When the morphology is not transparently compositional, label it as a lexical/morphological correspondence.',i:[['покупать ↔ купить','купить','different stems','aspectual correspondence in BUY family','Я купил хлеб.','私はパンを買った。'],['говорить ↔ сказать','сказать','different lexical stems','contextual/aspectual correspondence','Он сказал правду.','彼は真実を言った。'],['вставать ↔ встать','встать','stem alternation + imperfective expansion','whole-family aspect relation','Я встал рано.','私は早く起きた。']]}];let si=0,wi=0;function sp(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(' ↔ ',' '));u.lang='ru-RU';u.rate=.88;speechSynthesis.speak(u)}function r(){const s=S[si];bar.innerHTML=S.map((x,i)=>`<button class="${i===si?'on':''}" onclick="si=${i};wi=0;r()">${x.s}</button>`).join('');big.textContent=s.s;title.textContent=s.t;lead.textContent=s.l;warn.textContent='⚠️ '+s.w;grid.innerHTML=s.i.map((x,i)=>`<button class="verb ${i===wi?'on':''}" onclick="wi=${i};r()"><div class="ru">${x[0]}</div><div class="muted">${x[3]}</div></button>`).join('');const x=s.i[wi];word.textContent=x[0];base.textContent=x[1];contrib.textContent=x[2];whole.textContent=x[3];exRu.textContent=x[4];exJp.textContent=x[5];sound.onclick=()=>sp(x[0]);exSound.onclick=()=>sp(x[4])}r();</script></body></html>
