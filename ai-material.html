<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Russian Structure Lab — AI Material</title><style>:root{--ink:#18211e;--muted:#6f7672;--paper:#f3f0e8;--cream:#fbfaf6;--line:#d8d5cc;--green:#285e50;--gold:#a98a4e;--focus:#fff3c9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif}button,textarea{font:inherit;color:inherit}.ru{font-family:Georgia,"Times New Roman",serif}.top{min-height:58px;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f3f0e8ef;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:9px}.mark{width:34px;height:34px;border:1px solid;border-radius:50%;display:grid;place-items:center;font:20px Georgia}.brand small{display:block;color:var(--muted);font-size:8px}.actions,.rowBtns,.tools{display:flex;gap:7px;flex-wrap:wrap}.btn,.pill{border:1px solid var(--line);background:var(--cream);border-radius:18px;padding:8px 11px;font-size:10px}.primary{background:var(--ink);color:white;border-color:var(--ink)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:calc(100vh - 58px)}main{padding:22px 5vw 90px}.side{border-left:1px solid var(--line);background:var(--cream);padding:20px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.sentence{font:clamp(31px,4vw,54px)/1.6 Georgia;margin:25px 0}.word{border:0;background:none;padding:2px 2px 5px;margin:0 2px;font:inherit}.word.active{background:var(--focus)}.word.related{box-shadow:inset 0 -3px 0 var(--green)}.panel,.meaningBox{margin-top:12px;border:1px solid var(--line);background:var(--cream);padding:13px}.subtle{color:var(--muted);font-size:10px;line-height:1.6}.kv{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:11px}.big{font:28px Georgia}.chunk{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--cream);padding:12px;margin:8px 0}.tree .node{margin:7px 0 7px 16px}.tree button{border:1px solid var(--line);background:#fff;padding:8px 10px}.empty{min-height:55vh;display:grid;place-content:center;text-align:center;color:var(--muted);line-height:1.7}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.modalin{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:18px}.modalhead{display:flex;justify-content:space-between}.close{border:0;background:none;font-size:25px}.textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--cream);padding:12px}.label{font-size:9px;color:var(--muted);margin-bottom:7px}.status{margin-top:7px;color:var(--muted);font-size:10px}.notice{padding:10px 12px;background:#f2eee4;border-left:3px solid var(--gold);font-size:10px}.navBottom{position:fixed;left:0;right:360px;bottom:0;border-top:1px solid var(--line);background:#f3f0e8f3;display:grid;grid-template-columns:repeat(4,1fr);z-index:19}.navBottom button{border:0;background:none;padding:13px 5px;font-size:10px}.navBottom button.on{font-weight:700;background:#ebe8df}.deepToggle{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:11px 0}.hidden{display:none}.saved{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line)}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line)}.navBottom{right:0}.brand small{display:none}}@media(max-width:560px){main{padding:17px 13px 90px}.side{padding:16px}.sentence{font-size:34px}.kv{grid-template-columns:95px 1fr}}</style></head><body><header class="top"><div class="brand"><span class="mark">Я</span><span><strong>Russian Structure Lab</strong><small>AI MATERIAL · READ → TOUCH → STRUCTURE</small></span></div><div class="actions"><a class="btn" href="index.html">← Learn</a><a class="btn" href="my-material.html">🪆 My Material</a><button class="btn primary" id="openImport">＋ AI教材</button></div></header><div class="layout"><main><div id="reader"></div></main><aside class="side" id="detail"></aside></div><nav class="navBottom"><button class="on" data-view="text">🇷🇺 Text</button><button data-view="chunks">⌁ Meaning Chunks</button><button data-view="structure">⌘ Sentence Architecture</button><button data-view="library">▤ Library</button></nav><div class="modal" id="importModal"><div class="modalin"><div class="modalhead"><h2>AI教材を追加</h2><button class="close" data-close="importModal">×</button></div><div class="notice">AI Material · not CEFR certified<br>アプリはAI APIを呼びません。文章＋分析プロンプトをコピーし、ChatGPT等でJSONを作って戻します。</div><div class="panel"><div class="label">1 · Russian text</div><textarea class="textarea ru" id="sourceText" placeholder="ここにロシア語文章を貼り付け"></textarea><div class="rowBtns"><button class="btn" id="copyPrompt">Copy analysis prompt</button><button class="btn" id="copyCombined">Copy text + prompt</button></div><div class="status" id="copyStatus"></div></div><div class="panel"><div class="label">2 · Generated JSON</div><textarea class="textarea" id="jsonInput" placeholder='{"schemaVersion":"1.0","language":"ru",...}'></textarea><div class="rowBtns"><button class="btn primary" id="loadAnalysis">Load analysis</button></div><div class="status" id="jsonStatus"></div></div></div></div><script src="ai-material-prompt.js"></script><script src="ai-material-engine.js"></script><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],E=RSL_AI_MATERIAL_ENGINE,P=RSL_AI_PROMPT;let lesson=null,sentenceIndex=0,selectedWordId=null,currentView='text',meaningOpen=false,deepOpen=false;function esc(v=''){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function sent(){return lesson?.sentences?.[sentenceIndex]||null}function speak(t){if(!t)return;if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.84;speechSynthesis.cancel();speechSynthesis.speak(u)}function textHtml(s){const ws=[...(s.words||[])].filter(w=>Number.isInteger(w.start)&&Number.isInteger(w.end)).sort((a,b)=>a.start-b.start);let h='',p=0;for(const w of ws){h+=esc(s.text.slice(p,w.start));h+=`<button class="word ${selectedWordId===w.id?'active':''}" data-word="${esc(w.id)}">${esc(w.stressed||w.surface)}</button>`;p=w.end}return h+esc(s.text.slice(p))}function fmt(v){if(v==null)return'';return typeof v==='object'?JSON.stringify(v):String(v)}function render(){const r=$('#reader'),s=sent();if(currentView==='library')return library();if(!s){r.innerHTML='<div class="empty">Russian AI Material<br>「＋ AI教材」から始めます。</div>';$('#detail').innerHTML='<div class="empty">単語に触れると<br>Case / Aspect / Morphology が開きます。</div>';return}if(currentView==='chunks')return chunks();if(currentView==='structure')return structure();r.innerHTML=`<div class="meta"><span>${esc(lesson.title||'Russian AI Material')} · ${sentenceIndex+1}/${lesson.sentences.length}</span><span>AI analysis</span></div><div class="sentence ru">${textHtml(s)}</div><div class="tools"><button class="pill" id="speakSentence">▶︎ Sentence</button><button class="pill" id="meaning">${meaningOpen?'意味を閉じる':'文の意味'}</button>${lesson.sentences.length>1?'<button class="pill" id="prev">←</button><button class="pill" id="next">→</button>':''}</div>${meaningOpen?`<div class="meaningBox">${esc(s.overallMeaning?.ja||'')}<div class="subtle">${esc(s.overallMeaning?.en||'')}</div></div>`:''}`;$$('.word').forEach(b=>b.onclick=()=>{selectedWordId=b.dataset.word;const w=s.words?.find(x=>x.id===selectedWordId);speak(w?.ttsText||w?.surface);render()});$('#speakSentence').onclick=()=>speak(s.ttsText||s.stressedText||s.text);$('#meaning').onclick=()=>{meaningOpen=!meaningOpen;render()};$('#prev')?.addEventListener('click',()=>{sentenceIndex=Math.max(0,sentenceIndex-1);selectedWordId=null;render()});$('#next')?.addEventListener('click',()=>{sentenceIndex=Math.min(lesson.sentences.length-1,sentenceIndex+1);selectedWordId=null;render()});detail()}function detail(){const w=sent()?.words?.find(x=>x.id===selectedWordId),d=$('#detail');if(!w){d.innerHTML='<div class="empty">単語をタップすると<br>分析が静かに開きます。</div>';return}const pos=w.partOfSpeech?.ja||w.partOfSpeech?.en||w.partOfSpeech?.ru||'';d.innerHTML=`<div class="big ru">${esc(w.stressed||w.surface)}</div><div class="subtle">${esc(w.surface)}</div><div class="kv"><span>Lemma</span><b>${esc(w.lemma||'')}</b></div><div class="kv"><span>Part of speech</span><b>${esc(pos)}</b></div><div class="kv"><span>Meaning</span><b>${esc(w.meaning?.ja||'')}</b></div><button class="deepToggle" id="more">${deepOpen?'− Close analysis':'+ Case / Aspect / Morphology'}</button><div class="${deepOpen?'':'hidden'}">${deep(w)}</div>`;$('#more').onclick=()=>{deepOpen=!deepOpen;detail()}}function deep(w){let h='';if(w.morphology)h+=`<div class="panel"><b>Morphology</b><div class="subtle">${esc(fmt(w.morphology))}</div></div>`;if(w.aspect||w.aspectPair)h+=`<div class="panel"><b>Aspect</b><div>${esc(fmt(w.aspect))}</div><div class="subtle">pair: ${esc(fmt(w.aspectPair)||'—')}</div></div>`;if(w.morphemes?.length)h+=`<div class="panel"><b>Word Anatomy</b>${w.morphemes.map(m=>`<div class="kv"><span class="ru">${esc(m.text||'')}</span><span>${esc(m.type||'')} · ${esc(m.meaning?.ja||m.meaning||'')}</span></div>`).join('')}</div>`;if(w.grammar)h+=`<div class="panel"><b>Grammar</b><div class="subtle">${esc(fmt(w.grammar))}</div></div>`;if(w.declension)h+=`<div class="panel"><b>Declension</b><div class="subtle">${esc(fmt(w.declension))}</div></div>`;if(w.conjugation)h+=`<div class="panel"><b>Conjugation</b><div class="subtle">${esc(fmt(w.conjugation))}</div></div>`;if(w.wordFamily?.length)h+=`<div class="panel"><b>Word Family</b><div class="subtle">${esc(fmt(w.wordFamily))}</div></div>`;if(w.alternativeAnalysis?.length)h+=`<div class="panel"><b>Alternative analysis</b><div class="subtle">${esc(fmt(w.alternativeAnalysis))}</div></div>`;return h||'<div class="subtle">追加分析はありません。</div>'}function chunks(){const s=sent();$('#reader').innerHTML=`<div class="meta"><span>Meaning Chunks</span></div>${(s.chunks||[]).map(c=>`<button class="chunk" data-chunk="${esc(c.id)}"><div class="ru big">${esc(c.stressed||c.text)}</div><div>${esc(c.meaningOrder?.ja||'')}</div><div class="subtle">自然な意味：${esc(c.naturalMeaning?.ja||'')} · ${esc(c.function?.ja||c.function?.en||'')}</div></button>`).join('')||'<div class="panel">chunk情報はありません。</div>'}`;$('#detail').innerHTML='<div class="empty">Chunkを選ぶと本文へ戻ります。</div>';$$('[data-chunk]').forEach(b=>b.onclick=()=>{const c=s.chunks?.find(x=>x.id===b.dataset.chunk);currentView='text';selectedWordId=c?.wordIds?.[0]||null;setTab('text')})}function tree(n){if(!n)return'';return `<div class="node"><button data-node="${esc(n.id||'')}"><b>${esc(n.labelJa||n.labelEn||n.labelRu||n.type||'node')}</b> <span class="ru">${esc(n.text||'')}</span></button>${(n.children||[]).map(tree).join('')}</div>`}function find(n,id){if(!n)return null;if(n.id===id)return n;for(const c of n.children||[]){const f=find(c,id);if(f)return f}return null}function structure(){const s=sent();$('#reader').innerHTML=`<div class="meta"><span>Sentence Architecture</span></div><div class="panel tree">${tree(s.structure?.tree)||'構造情報はありません。'}</div>`;$('#detail').innerHTML='<div class="empty">構造ノードを選ぶと本文へ戻ります。</div>';$$('[data-node]').forEach(b=>b.onclick=()=>{const n=find(s.structure?.tree,b.dataset.node);currentView='text';selectedWordId=n?.refIds?.[0]||null;setTab('text')})}function library(){const list=E.listLessons();$('#reader').innerHTML=`<div class="notice">AI Material · not CEFR certified</div><div class="panel">${list.length?list.map((x,i)=>`<div class="saved"><div><b>${esc(x.title)}</b><div class="subtle">${new Date(x.savedAt).toLocaleString()}</div></div><div class="rowBtns"><button class="btn" data-open="${i}">開く</button><button class="btn" data-del="${i}">削除</button></div></div>`).join(''):'保存済みAI教材はありません。'}</div>`;$('#detail').innerHTML='<div class="empty">CEFR教材とは別保存です。</div>';$$('[data-open]').forEach(b=>b.onclick=()=>{lesson=list[+b.dataset.open].data;sentenceIndex=0;setTab('text')});$$('[data-del]').forEach(b=>b.onclick=()=>{E.deleteLesson(list[+b.dataset.del].key);library()})}function setTab(v){currentView=v;$$('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));render()}$$('[data-view]').forEach(b=>b.onclick=()=>setTab(b.dataset.view));function open(id){$('#'+id).classList.add('open')}function close(id){$('#'+id).classList.remove('open')}$('#openImport').onclick=()=>open('importModal');$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$('#copyPrompt').onclick=async()=>{try{await navigator.clipboard.writeText(P.template);$('#copyStatus').textContent='分析プロンプトをコピーしました。'}catch(e){$('#copyStatus').textContent=e.message}};$('#copyCombined').onclick=async()=>{try{await navigator.clipboard.writeText(P.buildPrompt($('#sourceText').value));$('#copyStatus').textContent='文章入りプロンプトをコピーしました。'}catch(e){$('#copyStatus').textContent=e.message}};$('#loadAnalysis').onclick=()=>{try{const data=JSON.parse(E.cleanJson($('#jsonInput').value));E.validate(data);E.saveLesson(data);lesson=data;sentenceIndex=0;selectedWordId=null;close('importModal');setTab('text')}catch(e){$('#jsonStatus').textContent='読み込めません：'+e.message}};try{lesson=E.listLessons()[0]?.data||null}catch{}render();</script></body></html>
