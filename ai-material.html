<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STORAGE_KEY='russianStructureLab.aiLibrary.v1';
let lesson=null,activeSentence=0,showStress=true,activeWord=null;
const PROMPT=`Russian Structure Lab — AI教材JSON生成プロンプト v1.0

あなたはロシア語学、ロシア語形態論、統語論、動詞の体（вид）、格変化、語形成、発音・アクセント、外国語としてのロシア語教育の専門家です。入力されたロシア語文章を、日本人学習者向け Russian Structure Lab の教材JSONへ変換してください。

【最優先】出力は有効なJSONオブジェクトだけにしてください。Markdownコードフェンス、前置き、後書き、説明文は禁止です。schemaVersion は "1.0"、language は "ru"。originalText と各 sentence.text は入力原文を完全一致で保存し、語順・綴り・句読点・段落を変更しないでください。すべての文を処理してください。

学習順序は 1) 本文 2) Word Anatomy 3) Meaning Chunks 4) Sentence Architecture 5) Aspect & Morphology。表面は簡潔にし、詳細は段階開示できる階層JSONにしてください。

各 sentence は可能な限り id,text,stressedText,ttsText,overallMeaning{ja,en},words,chunks,structure,grammarNotes,alternativeAnalysis を持たせてください。

各 word は可能な限り id,surface,stressed,start,end,meaning{ja,en},lemma,partOfSpeech{ru,en,ja},morphemes,morphology,grammar,case,ending,agreement,aspect,aspectPair,conjugation,wordFamily,relations,confidence,confidenceReason,alternativeAnalysis を持たせてください。start/end は sentence.text 内の0始まり・end exclusiveで sentence.text.slice(start,end)===surface にしてください。

ロシア語アクセントは originalText や surface を改変せず、stressed / stressedText に別保存してください。ё は原文にある場合は維持し、AIが勝手に е↔ё を原文フィールドで変更しないでください。

名詞・形容詞・代名詞では可能な限り case (nominative/genitive/dative/accusative/instrumental/prepositional), gender, number, animacy, declension, ending, stem, agreement, grammaticalRole を示してください。なぜその格・語尾になっているのかを explanationJa / explanationEn で簡潔に示してください。

動詞では lemma、imperfective/perfective、aspectPair、tense、person、number、gender、mood、voice、reflexive、conjugationClass、prefix、suffix、stem を可能な限り示してください。体のペアは存在が確実な場合だけ示し、意味が完全一致しないペアは note で注意してください。文中でその体が選ばれている意味（process/repetition/background vs bounded/completed/result 等）も aspect.explanationJa / explanationEn で示してください。

morphemes は prefix / root / suffix / ending / postfix などに分けられる場合のみ分解し、各要素に text,type,function,meaning,confidence を持たせてください。不確かな語源分析を断定しないでください。

wordFamily は現代ロシア語で学習価値の高い語を3〜8語程度、word,stressed,partOfSpeech,meaning{ja,en},relationToCurrentWord,learningPriority と共に示してください。

chunks は意味のまとまりで id,text,stressed,start,end,wordIds,type,meaningOrder{ja,en},naturalMeaning{ja,en},function{ja,en},headWordId,structureNodeId,note を持たせてください。meaningOrder はロシア語の語順・構造を感じられる理解、naturalMeaning は自然な訳として分離してください。chunk の start/end も sentence.text.slice(start,end)===text にしてください。

structure は英語SVOCだけを強制せず、ロシア語の実際の構造に合わせて subject,predicate,object,attribute,adverbial,prepositional phrase,subordinate clause,relative clause,infinitive construction,impersonal construction 等を認識してください。structure.tree の各 node は id,type,labelRu,labelEn,labelJa,text,refIds,children を持たせ、本文のword IDへ参照可能にしてください。

confidence は overall だけでなく meaning,lemma,stress,case,ending,aspect,morphology,syntax など項目別に high/medium/low/uncertain を使ってください。複数の分析が成立する場合は alternativeAnalysis と reason を使い、断定しないでください。

学習者を採点しません。「暗記してください」型ではなく、語形がなぜ変わったか・どの構造に属するかを見えるようにしてください。

最終確認: JSON parse可能、originalText不変、全文処理、word/chunk offset一致、アクセント別フィールド、格と語尾の整合、形容詞・代名詞の一致、動詞の体と活用、不確実性表示、word→chunk→structure参照、meaningOrderとnaturalMeaningの分離。

INPUT

const sample={schemaVersion:'1.0',language:'ru',title:'買わなかった本',originalText:'Я вчера не купил свою интересную книгу.',sentences:[{id:'s1',text:'Я вчера не купил свою интересную книгу.',stressedText:'Я вчера́ не купи́л свою́ интере́сную кни́гу.',ttsText:'Я вчера не купил свою интересную книгу.',overallMeaning:{ja:'私は昨日、自分の面白い本を買わなかった。',en:'Yesterday I did not buy my interesting book.'},words:[
{id:'w1',surface:'Я',stressed:'Я',start:0,end:1,meaning:{ja:'私は',en:'I'},lemma:'я',partOfSpeech:{en:'pronoun',ja:'代名詞'},case:'nominative',grammar:{role:'subject'},confidence:{overall:'high',case:'high'}},
{id:'w2',surface:'вчера',stressed:'вчера́',start:2,end:7,meaning:{ja:'昨日',en:'yesterday'},lemma:'вчера',partOfSpeech:{en:'adverb',ja:'副詞'},grammar:{role:'time adverbial'},confidence:{overall:'high'}},

{id:'ch1',text:'Я вчера',stressed:'Я вчера́',start:0,end:7,wordIds:['w1','w2'],meaningOrder:{ja:'私は―昨日',en:'I — yesterday'},naturalMeaning:{ja:'私は昨日',en:'Yesterday I'},function:{ja:'主語＋時',en:'subject + time'}},
{id:'ch2',text:'не купил',stressed:'не купи́л',start:8,end:16,wordIds:['w3','w4'],meaningOrder:{ja:'買わなかった',en:'did not buy'},naturalMeaning:{ja:'買わなかった',en:'did not buy'},function:{ja:'否定＋述語',en:'negation + predicate'}},
{id:'ch3',text:'свою интересную книгу',stressed:'свою́ интере́сную кни́гу',start:17,end:38,wordIds:['w5','w6','w7'],meaningOrder:{ja:'自分の―面白い―本を',en:'own — interesting — book'},naturalMeaning:{ja:'自分の面白い本を',en:'my own interesting book'},function:{ja:'対格の名詞句',en:'accusative noun phrase'}}],structure:{tree:{id:'n1',type:'sentence',labelRu:'предложение',labelJa:'文',labelEn:'sentence',text:'Я вчера не купил свою интересную книгу.',refIds:['w1','w2','w3','w4','w5','w6','w7'],children:[{id:'n2',type:'subject',labelRu:'подлежащее',labelJa:'主語',labelEn:'subject',text:'Я',refIds:['w1'],children:[]},{id:'n3',type:'time_adverbial',labelRu:'обстоятельство времени',labelJa:'時の副詞',labelEn:'time adverbial',text:'вчера',refIds:['w2'],children:[]},{id:'n4',type:'predicate',labelRu:'сказуемое',labelJa:'述語',labelEn:'predicate',text:'не купил',refIds:['w3','w4'],children:[]},{id:'n5',type:'object',labelRu:'дополнение',labelJa:'目的語',labelEn:'object',text:'свою интересную книгу',refIds:['w5','w6','w7'],children:[]}]}}}]};
function esc(v=''){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function currentSentence(){return lesson?.sentences?.[activeSentence]||null}
function validate(data){if(!data||typeof data!=='object'||Array.isArray(data))throw Error('JSONオブジェクトではありません');if(data.language&&data.language!=='ru')throw Error('language は ru である必要があります');if(!Array.isArray(data.sentences)||!data.sentences.length)throw Error('sentences がありません');for(const s of data.sentences){if(typeof s.text!=='string')throw Error('sentence.text がありません');for(const w of s.words||[]){if(!Number.isInteger(w.start)||!Number.isInteger(w.end)||s.text.slice(w.start,w.end)!==w.surface)throw Error(`単語位置が一致しません: ${w.surface||w.id||'unknown'}`)}for(const c of s.chunks||[]){if(!Number.isInteger(c.start)||!Number.isInteger(c.end)||s.text.slice(c.start,c.end)!==c.text)throw Error(`chunk位置が一致しません: ${c.text||c.id||'unknown'}`)}}return true}
function normalizeWords(s){return [...(s.words||[])].sort((a,b)=>a.start-b.start)}
function render(){const r=$('#reader'),s=currentSentence();if(!s){r.innerHTML='<div class="empty"><div><b>ロシア語本文から始めます</b><br>「＋ 教材」→文章を貼る→AI分析→JSONを戻す、で教材になります。<br><br><button class="pill primary" id="emptySample">サンプルを見る</button></div></div>';$('#emptySample')?.addEventListener('click',()=>loadLesson(sample));return}const words=normalizeWords(s);let html='',pos=0;for(const w of words){html+=esc(s.text.slice(pos,w.start));html+=`<span class="word" data-word="${esc(w.id)}">${esc(showStress?(w.stressed||w.surface):w.surface)}</span>`;pos=w.end}html+=esc(s.text.slice(pos));r.innerHTML=`<div class="meta"><div><div class="title">${esc(lesson.title||'AI Material')} · ${activeSentence+1}/${lesson.sentences.length}</div><div class="subtle">AI analysis · confidence-aware</div></div><button class="iconbtn" id="speakSentence">▶︎ RU</button></div><div class="sentence" lang="ru">${html}</div><div class="reader-tools"><button class="pill ${showStress?'primary':''}" id="toggleStress">アクセント</button><button class="pill" id="overall">文の意味</button>${lesson.sentences.length>1?'<button class="pill" id="prevSentence">←</button><button class="pill" id="nextSentence">→</button>':''}</div><div id="overallBox"></div>`;$$('.word').forEach(el=>el.onclick=()=>openWord(el.dataset.word));$('#toggleStress').onclick=()=>{showStress=!showStress;render()};$('#speakSentence').onclick=()=>speak(s.ttsText||s.text);$('#overall').onclick=()=>{const b=$('#overallBox');b.innerHTML=b.innerHTML?'':`<div class="panel"><div>${esc(s.overallMeaning?.ja||'')}</div><div class="subtle" style="margin-top:5px">${esc(s.overallMeaning?.en||'')}</div></div>`};$('#prevSentence')?.addEventListener('click',()=>{activeSentence=Math.max(0,activeSentence-1);render()});$('#nextSentence')?.addEventListener('click',()=>{activeSentence=Math.min(lesson.sentences.length-1,activeSentence+1);render()})}
function openWord(id){const s=currentSentence(),w=s?.words?.find(x=>x.id===id);if(!w)return;activeWord=id;highlight(w);const pos=w.partOfSpeech?.ja||w.partOfSpeech?.en||'',conf=typeof w.confidence==='object'?(w.confidence.overall||''):(w.confidence||'');$('#wordSheetContent').innerHTML=`<div class="sheethead"><div><div class="ru-big">${esc(w.surface)}</div><div class="stressed">${esc(w.stressed||'')}</div><div class="meaning">${esc(w.meaning?.ja||'')}</div><div class="subtle">${esc(w.meaning?.en||'')} ${pos?'· '+esc(pos):''}</div></div><button class="close" id="closeWord">×</button></div><div class="coregrid"><div class="card"><div class="label">Lemma</div><div class="value">${esc(w.lemma||'—')}</div></div><div class="card"><div class="label">Case / Ending</div><div class="value">${esc(w.case||'—')} ${w.ending?'· '+esc(w.ending):''}</div></div><div class="card"><div class="label">Aspect</div><div class="value">${esc(w.aspect?.value||w.aspect||'—')}</div></div><div class="card"><div class="label">Aspect pair</div><div class="value">${esc(pairText(w.aspectPair))}</div></div></div><button class="expand" id="expandWord">さらに見る · 語形 / 活用 / 語族 / confidence</button><div class="details" id="wordDetails">${renderWordDetails(w)}</div>${conf?`<div class="subtle" style="margin-top:12px">analysis confidence: ${esc(conf)}</div>`:''}`;$('#wordSheet').classList.add('open');$('#overlay').classList.add('show');$('#closeWord').onclick=closeSheets;$('#expandWord').onclick=()=>$('#wordDetails').classList.toggle('open')}
function pairText(p){if(!p)return'—';if(typeof p==='string')return p;return [p.imperfective,p.perfective].filter(Boolean).join(' ↔ ')||'—'}
function objRows(title,obj){if(!obj||typeof obj!=='object'||!Object.keys(obj).length)return'';return `<div class="section"><h3>${esc(title)}</h3>${Object.entries(obj).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span></div>`).join('')}</div>`}
function renderWordDetails(w){let out='';out+=objRows('Morphology',w.morphology);out+=objRows('Grammar',w.grammar);out+=objRows('Agreement',w.agreement);out+=objRows('Conjugation',w.conjugation);if(w.aspect&&typeof w.aspect==='object')out+=objRows('Aspect meaning',w.aspect);if(w.morphemes?.length)out+=`<div class="section"><h3>Word Anatomy</h3>${w.morphemes.map(m=>`<div class="kv"><span>${esc(m.type||'morpheme')}</span><span><b>${esc(m.text||'')}</b> ${esc(m.function||m.meaning||'')} ${m.confidence?'· '+esc(m.confidence):''}</span></div>`).join('')}</div>`;if(w.wordFamily?.length)out+=`<div class="section"><h3>Word Family</h3><div class="family">${w.wordFamily.map(f=>`<div class="familyitem"><div class="ru">${esc(f.stressed||f.word)}</div><div>${esc(f.meaning?.ja||f.meaning||'')}</div><div class="subtle">${esc(f.relationToCurrentWord||'')} ${f.learningPriority?'· '+esc(f.learningPriority):''}</div></div>`).join('')}</div></div>`;out+=objRows('Confidence',w.confidence);if(w.alternativeAnalysis?.length)out+=`<div class="section"><h3>Alternative analysis</h3><div class="subtle">${esc(JSON.stringify(w.alternativeAnalysis))}</div></div>`;return out||'<div class="subtle">追加分析はありません。</div>'}
function highlight(w){$$('.word').forEach(x=>{x.classList.toggle('active',x.dataset.word===w.id);x.classList.remove('related')});const s=currentSentence(),ids=new Set();(w.relations?.chunkIds||[]).forEach(cid=>{const c=s.chunks?.find(x=>x.id===cid);(c?.wordIds||[]).forEach(id=>ids.add(id))});$$('.word').forEach(x=>{if(ids.has(x.dataset.word)&&x.dataset.word!==w.id)x.classList.add('related')})}
function closeSheets(){document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('open'));$('#overlay').classList.remove('show');$$('.word').forEach(x=>x.classList.remove('active','related'));activeWord=null}
function speak(text){if(!('speechSynthesis'in window))return toast('この端末では音声合成を利用できません');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.84;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()==='ru-ru')||vs.find(v=>v.lang.toLowerCase().startsWith('ru'))||null;speechSynthesis.speak(u)}
function openModal(id){$('#'+id).classList.add('open')}function closeModal(id){$('#'+id).classList.remove('open')}
function renderChunks(){const s=currentSentence();$('#chunkList').innerHTML=s?.chunks?.length?s.chunks.map(c=>`<button class="chunk" data-chunk="${esc(c.id)}"><div class="ru">${esc(c.stressed||c.text)}</div><div class="order">${esc(c.meaningOrder?.ja||'')}</div><div class="natural">自然な意味：${esc(c.naturalMeaning?.ja||'')} · ${esc(c.function?.ja||'')}</div></button>`).join(''):'<div class="panel">chunk情報はありません。</div>';$$('[data-chunk]').forEach(b=>b.onclick=()=>{closeModal('chunksModal');focusIds((s.chunks.find(x=>x.id===b.dataset.chunk)?.wordIds)||[])})}
function treeHtml(n){if(!n)return'';return `<div class="node"><button data-node="${esc(n.id||'')}"><b>${esc(n.labelJa||n.labelEn||n.type||'')}</b>${n.text?` <span class="badge">${esc(n.text)}</span>`:''}</button>${(n.children||[]).map(treeHtml).join('')}</div>`}
function findNode(n,id){if(!n)return null;if(n.id===id)return n;for(const c of n.children||[]){const f=findNode(c,id);if(f)return f}return null}
function renderStructure(){const s=currentSentence();$('#structureContent').innerHTML=s?.structure?.tree?`<div class="panel tree">${treeHtml(s.structure.tree)}</div>`:'<div class="panel">structure情報はありません。</div>';$$('[data-node]').forEach(b=>b.onclick=()=>{const n=findNode(s.structure.tree,b.dataset.node);closeModal('structureModal');focusIds(n?.refIds||[])})}
function renderAspect(){const s=currentSentence(),verbs=(s?.words||[]).filter(w=>w.aspect||w.aspectPair||w.morphology?.tense);$('#aspectList').innerHTML=verbs.length?verbs.map(w=>`<button class="aspectcard" data-aspect-word="${esc(w.id)}"><div class="ru">${esc(w.stressed||w.surface)} <span class="badge">${esc(w.lemma||'')}</span></div><div>${esc(w.aspect?.value||w.aspect||'')} ${w.aspectPair?'· '+esc(pairText(w.aspectPair)):''}</div><div class="note">${esc(w.aspect?.explanationJa||w.morphology?.tense||'')}</div></button>`).join(''):'<div class="panel">この文にはAspect/Morphology分析がありません。</div>';$$('[data-aspect-word]').forEach(b=>b.onclick=()=>{closeModal('aspectModal');openWord(b.dataset.aspectWord)})}
function focusIds(ids){const set=new Set(ids);$$('.word').forEach(x=>x.classList.toggle('related',set.has(x.dataset.word)));toast('本文の対応部分を表示しました')}
function saveLesson(data){const list=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'),key=data.originalText||data.title||String(Date.now());const next=[{key,title:data.title||'Russian AI Material',savedAt:Date.now(),data},...list.filter(x=>x.key!==key)].slice(0,30);localStorage.setItem(STORAGE_KEY,JSON.stringify(next))}
function loadLesson(data){try{validate(data);lesson=data;activeSentence=0;showStress=true;saveLesson(data);render();closeModal('importModal');toast('AI教材を読み込みました')}catch(e){$('#jsonStatus').textContent='読み込めません：'+e.message}}
function renderLibrary(){const list=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');$('#libraryList').innerHTML=list.length?list.map((x,i)=>`<div class="saveditem"><button class="btn" data-lib="${i}">開く</button><div><b>${esc(x.title)}</b><div class="subtle">${new Date(x.savedAt).toLocaleString()}</div></div></div>`).join(''):'保存済みAI教材はありません。';$$('[data-lib]').forEach(b=>b.onclick=()=>{lesson=list[+b.dataset.lib].data;activeSentence=0;render();closeModal('libraryModal')})}
function cleanJson(raw){let s=raw.trim();s=s.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a>=0&&b>a)s=s.slice(a,b+1);return s}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800)}
$('#openImport').onclick=()=>openModal('importModal');$$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));$('#overlay').onclick=closeSheets;
$('#copyPrompt').onclick=async()=>{await navigator.clipboard.writeText(PROMPT);$('#copyStatus').textContent='AI分析プロンプトをコピーしました。'};
$('#copyCombined').onclick=async()=>{const text=$('#russianInput').value.trim();if(!text)return $('#copyStatus').textContent='先にロシア語文章を貼り付けてください。';await navigator.clipboard.writeText(PROMPT.replace('{{RUSSIAN_TEXT}}',text));$('#copyStatus').textContent='文章入りAI分析プロンプトをコピーしました。'};
$('#loadJson').onclick=()=>{try{const data=JSON.parse(cleanJson($('#jsonInput').value));loadLesson(data)}catch(e){$('#jsonStatus').textContent='JSONとして読み取れません：'+e.message}};$('#sampleBtn').onclick=()=>loadLesson(sample);
$$('.navbtn').forEach(b=>b.onclick=()=>{const a=b.dataset.action;$$('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(a==='chunks'){renderChunks();openModal('chunksModal')}if(a==='structure'){renderStructure();openModal('structureModal')}if(a==='aspect'){renderAspect();openModal('aspectModal')}if(a==='library'){renderLibrary();openModal('libraryModal')}if(a==='reader'){document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'))}});
try{const list=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(list[0]?.data){validate(list[0].data);lesson=list[0].data}}catch{}render();
</script>
</body></html>
