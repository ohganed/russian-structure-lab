<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSL Hybrid Analysis Demo</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif;background:#f3f0e8;color:#18211e;margin:0}.wrap{max-width:980px;margin:auto;padding:28px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.bar button,.btn{border:1px solid #d8d5cc;background:#fbfaf6;padding:9px 13px;border-radius:20px}.bar button.on{background:#18211e;color:white}.card{background:#fbfaf6;border:1px solid #d8d5cc;padding:18px;margin-top:14px}.ru{font-family:Georgia,"Times New Roman",serif}.tokens{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.token{border:0;background:none;font:30px Georgia,serif;padding:4px}.token.warn{border-bottom:2px dotted #a98a4e}.token.ai{border-bottom:2px solid #285e50}.row{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:9px 0;border-top:1px solid #e4e1d8}.muted{color:#737a76;font-size:12px}.panel{margin-top:14px;padding:14px;background:#edf0e9}.warnbox{background:#f2eee4}.textarea{width:100%;min-height:110px;padding:15px;font:22px/1.5 Georgia,serif}.json{width:100%;min-height:170px;padding:12px;font-family:ui-monospace,monospace}.parts{display:flex;gap:6px;flex-wrap:wrap}.part{border:1px solid #d8d5cc;padding:8px 10px;background:white}.small{font-size:11px;color:#737a76}</style></head><body><div class="wrap"><h1>Russian Structure Lab · Hybrid Analysis</h1><p class="muted">Local first. AI only when you want it. AI-generated JSON can also become a full learning material.</p><div class="bar"><button id="local" class="on" onclick="setMode('local')">Local Only</button><button id="ask" onclick="setMode('ask')">Ask When Needed</button><button id="ai" onclick="setMode('ai')">AI Assisted</button></div><textarea id="src" class="textarea">Президент подписал новый закон.</textarea><button class="btn" onclick="analyze()">教材化する</button><div id="material" class="card"></div><div class="card"><b>AI解析JSONを読み込む</b><p class="small">ChatGPTなどで解析したJSONをそのまま貼り付けて、この教材に統合できます。Local解析は消さず、AI由来データとして保持します。</p><textarea id="json" class="json">{
  "words": {
    "подписал": {
      "meaning": "署名した",
      "lemma": "подписать",
      "aspect": {"imperfective":"подписывать","perfective":"подписать"},
      "anatomy":[
        {"text":"под-","type":"prefix"},
        {"text":"-пис-","type":"root"},
        {"text":"-а-","type":"suffix"},
        {"text":"-ть","type":"infinitive marker"}
      ],
      "note":"文脈上は一回の完結した署名行為。"
    }
  }
}</textarea><button class="btn" onclick="importAI()">AIデータを統合</button></div></div><script>const localDB={"Президент":{meaning:"大統領",lemma:"президент",pos:"noun",confidence:.99},"подписал":{meaning:"署名した",lemma:"подписать",pos:"verb",confidence:.82,aspect:{imperfective:"подписывать",perfective:"подписать"},anatomy:[{text:"под-",type:"prefix"},{text:"-пис-",type:"root"},{text:"-а-",type:"suffix"},{text:"-ть",type:"infinitive marker"}]},"новый":{meaning:"新しい",lemma:"новый",pos:"adjective",confidence:.96},"закон":{meaning:"法律",lemma:"закон",pos:"noun",case:"accusative",confidence:.91}};let mode='local',aiDB={},selected=null,tokens=[];function setMode(m){mode=m;['local','ask','ai'].forEach(x=>document.getElementById(x).classList.toggle('on',x===m));analyze()}function clean(x){return x.replace(/[.,!?;:«»“”]/g,'')}function speak(t){if(!('speechSynthesis'in window))return;if(t==='Я')t='я';let u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}function analyze(){tokens=document.getElementById('src').value.trim().split(/\s+/);selected=null;render()}function merged(w){return Object.assign({},localDB[w]||{},aiDB[w]||{})}function render(){let html='<div class="tokens">'+tokens.map((t,i)=>{let w=clean(t),d=merged(w),low=d.confidence&&d.confidence<.9,cls=aiDB[w]?'ai':(low?'warn':'');return `<button class="token ${cls}" onclick="openWord(${i})">${t}</button>`}).join('')+'</div><p class="small">点線 = Local解析の確信度が低め / 緑線 = AIデータ統合済み</p>';if(selected!==null){let w=clean(tokens[selected]),l=localDB[w]||{},a=aiDB[w]||{},d=merged(w);html+=`<div class="panel"><h2 class="ru">${w}</h2><button class="btn" onclick="speak('${w}')">🎧 音</button><div class="row"><span>Meaning</span><b>${d.meaning||'未登録'}</b></div><div class="row"><span>Lemma</span><b class="ru">${d.lemma||w}</b></div><div class="row"><span>Source</span><b>${a.meaning||a.lemma||a.aspect||a.anatomy?'Local + AI':'Local'}</b></div>`;if(d.case)html+=`<div class="row"><span>Case</span><b>${d.case}</b></div>`;if(d.aspect)html+=`<div class="row"><span>Aspect</span><b class="ru">${d.aspect.imperfective} ↔ ${d.aspect.perfective}</b></div>`;if(d.anatomy)html+=`<div class="row"><span>Word Anatomy</span><div class="parts">${d.anatomy.map(p=>`<span class="part"><small>${p.type}</small><b class="ru">${p.text}</b></span>`).join('')}</div></div>`;if(d.note)html+=`<div class="row"><span>Note</span><b>${d.note}</b></div>`;let uncertain=l.confidence&&l.confidence<.9;if((mode==='ask'&&uncertain)||mode==='ai')html+=`<div class="panel warnbox"><b>✨ AIで確認</b><p class="small">この語のLocal解析は${uncertain?'少し不確実です':'AI併用モードです'}。必要ならChatGPT等でこの語だけ確認し、下のJSON欄から結果を統合できます。</p></div>`;html+='</div>'}document.getElementById('material').innerHTML=html}function openWord(i){selected=i;let w=clean(tokens[i]);speak(w);render()}function importAI(){try{let obj=JSON.parse(document.getElementById('json').value);aiDB=Object.assign(aiDB,obj.words||{});localStorage.setItem('rsl-ai-cache',JSON.stringify(aiDB));render()}catch(e){alert('JSONの形式を確認してください')} }try{aiDB=JSON.parse(localStorage.getItem('rsl-ai-cache')||'{}')}catch(e){}analyze();</script></body></html>
