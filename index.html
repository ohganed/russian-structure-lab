const lessons=[
{id:'work',context:'A quiet Tuesday morning',sentence:'Я сегодня работаю дома.',translation:'私は今日は家で仕事をしています。',words:[['Я','Я','я','私','代名詞・単数','動作をする人','主格 / Nominative'],['сегодня','сего́дня','сегодня','今日','副詞','いつ行うか'],['работаю','рабо́таю','работать','仕事をしている','現在・一人称・単数','文の中心となる活動','', '',['работать','поработать','今は出来事の内部、進行中の活動を見ています。']],['дома','до́ма','дома','家で／家にいて','場所の副詞','活動が行われる場所','','дом の前置格ではなく、独立した場所の副詞です。']],chunks:[['Я','私は','視点の中心'],['сегодня работаю','今日は仕事をしている','時＋活動'],['дома','家で','場所']],arch:[['WHO','Я','blue'],['WHEN','сегодня','sand'],['ACTION','работаю','red'],['WHERE','дома','green']],insight:'動詞 работаю の形そのものが「私」を含みます。それでも Я を置くことで、話し手を静かに前景化しています。'},
{id:'book',context:'After work, at home',sentence:'Я дал книгу своей младшей сестре.',translation:'私は自分の妹に本を渡しました。',words:[['Я','Я','я','私','代名詞・単数','渡した人','主格 / Nominative'],['дал','дал','дать','渡した／与えた','過去・男性・単数','中心となる出来事','', '',['давать','дать','出来事を境界のある一まとまりとして見ています。']],['книгу','кни́гу','книга','本を','女性・単数','渡されたもの','対格 / Accusative'],['своей','свое́й','свой','自分の','女性・単数・与格','сестре と一致','与格 / Dative'],['младшей','мла́дшей','младший','年下の','女性・単数・与格','сестре と一致','与格 / Dative'],['сестре','сестре́','сестра','姉／妹に','女性・単数','受け手 / Recipient','与格 / Dative','сестра → сестре。語尾 -е が受け手の関係を運びます。']],chunks:[['Я дал','私は渡した','行為者＋出来事'],['книгу','本を','渡されたもの'],['своей младшей сестре','自分の妹に','女性・単数・与格でつながる受け手']],arch:[['GIVER','Я','blue'],['TRANSFER','дал','red'],['THING','книгу','sand'],['RECIPIENT','своей младшей сестре','green']],insight:'語順ではなく語尾が関係を支えています。своей・младшей・сестре は一つのまとまりです。'},
{id:'cold',context:'A cool evening in Moscow',sentence:'Мне сегодня немного холодно.',translation:'私は今日は少し寒いです。',words:[['Мне','Мне','я','私には／私は','代名詞・単数','寒さを経験する人','与格 / Dative','主語ではなく、状態を経験する人が与格になります。'],['сегодня','сего́дня','сегодня','今日','副詞','時'],['немного','немно́го','немного','少し','副詞','程度'],['холодно','хо́лодно','холодно','寒い','状態述語','経験される状態']],chunks:[['Мне','私には','状態の経験者'],['сегодня','今日は','時'],['немного холодно','少し寒い','程度＋状態']],arch:[['EXPERIENCER','Мне','green'],['TIME','сегодня','sand'],['DEGREE','немного','blue'],['STATE','холодно','red']],insight:'Мне は「私が」ではなく「私にとって」に近い形です。与格は状態の経験者も表します。'}];
const caseHints={мне:'与格 / Dative',Мне:'与格 / Dative',нам:'与格 / Dative',Нам:'与格 / Dative',вас:'対格 / Accusative',коллегам:'与格 / Dative',кухне:'前置格 / Prepositional',столе:'前置格 / Prepositional',ключи:'対格 / Accusative',цветы:'対格 / Accusative',двери:'生格 / Genitive',ванной:'前置格 / Prepositional',воды:'生格 / Genitive',молоко:'対格 / Accusative',окну:'与格 / Dative',суп:'対格 / Accusative',встречу:'対格 / Accusative',пятницу:'対格 / Accusative',офис:'対格 / Accusative',письмо:'対格 / Accusative',класс:'対格 / Accusative',понедельника:'生格 / Genitive',библиотеке:'前置格 / Prepositional',ответ:'対格 / Accusative',позицию:'対格 / Accusative',документы:'対格 / Accusative',подпись:'対格 / Accusative',причину:'対格 / Accusative',станции:'生格 / Genitive',платформе:'与格 / Dative',остановку:'対格 / Accusative',мосту:'与格 / Dative',аэропорта:'生格 / Genitive',багаж:'対格 / Accusative',орбиту:'対格 / Accusative'};
function importedMaterialToLesson(r){const clean=s=>s.replace(/[.,!?—:;]/g,''),tokens=clean(r[2]).split(/\s+/).filter(Boolean),accents=r[5].split('/'),lemmas=r[6].split('/'),glosses=r[7].split('/'),chunkRu=r[8].split('/'),chunkJp=r[9].split('/'),functions=r[10].split('/'),colors=['blue','red','sand','green'];return{id:r[0],context:r[1],sentence:r[2],translation:r[3],words:tokens.map((token,i)=>{const chunkIndex=chunkRu.findIndex(c=>clean(c).split(/\s+/).includes(token));return[token,accents[i],lemmas[i],glosses[i],lemmas[i]===token.toLowerCase()?'基本形または文中形':'文中の活用形',functions[Math.max(0,chunkIndex)].replaceAll('_',' ').toLowerCase(),caseHints[token]||'']}),chunks:chunkRu.map((text,i)=>[text,chunkJp[i],functions[i].replaceAll('_',' ').toLowerCase()]),arch:chunkRu.map((text,i)=>[functions[i],text,colors[i%colors.length]]),insight:'場面と音を先に受け取り、必要なところから単語・まとまり・文の関係へ入れます。'}}
if(window.RSL_MATERIALS)lessons.push(...window.RSL_MATERIALS.map(importedMaterialToLesson));
const formNetworks={'я':[['Nominative','я'],['Genitive','меня́'],['Dative','мне'],['Accusative','меня́'],['Instrumental','мно́й'],['Prepositional','обо мне']],'книга':[['Nominative','кни́га'],['Genitive','кни́ги'],['Dative','кни́ге'],['Accusative','кни́гу'],['Instrumental','кни́гой'],['Prepositional','о кни́ге']],'сестра':[['Nominative','сестра́'],['Genitive','сестры́'],['Dative','сестре́'],['Accusative','сестру́'],['Instrumental','сестро́й'],['Prepositional','о сестре́']]};
const importedScenes=Object.fromEntries((window.RSL_MATERIALS||[]).map(r=>[r[0],r[4]]));
const situationScenes={work:'☀️　→　🏠　→　💻',book:'👤　→　📖　→　👧',cold:'🌆　→　❄️　→　🧥',...importedScenes};
let restored={};try{restored=JSON.parse(localStorage.getItem('rsl-state')||'{}')}catch{}
let lessonIndex=Number.isInteger(restored.lessonIndex)&&restored.lessonIndex>=0&&restored.lessonIndex<lessons.length?restored.lessonIndex:0;

if('speechSynthesis'in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices}
function russianVoice(){refreshVoices();return availableVoices.find(v=>v.lang.toLowerCase()==='ru-ru')||availableVoices.find(v=>v.lang.toLowerCase().startsWith('ru'))||availableVoices.find(v=>/milena|yuri|katya|irina|russian/i.test(v.name))||null}

function renderWorld(){const l=lessons[lessonIndex];if(layer==='words'){world.className='world';world.innerHTML='<label>Touch the Russian</label><div class="words" lang="ru">'+l.words.map((w,i)=>`<button class="${selected===i?'selected':''}" onclick="selectWord(${i})">${stress?w[1]:w[0]}</button>`).join('')+'</div><button class="peek" onclick="meaning=!meaning;renderWorld()">'+(meaning?l.translation:'意味を見る')+'</button>'}else if(layer==='chunks'){world.className='world';world.innerHTML='<label>Meaning moves in groups</label><div class="chunks">'+l.chunks.map(c=>`<button onclick="speak('${c[0]}');remember('chunk:${c[0]}')"><strong lang="ru">${c[0]}</strong><span>${c[1]}</span><small>${c[2]}</small></button>`).join('')+'</div>'}else{world.className='world sentence';world.innerHTML=`<label>The whole architecture</label><button class="whole" onclick="speak('${l.sentence}');remember('sentence:${l.id}')">${l.sentence}</button><div class="architecture">${l.arch.map(a=>`<div class="${a[2]}"><small>${a[0]}</small><b>${a[1]}</b></div>`).join('')}</div><p>${l.insight}</p><div class="audio"><button onclick="speak('${l.sentence}',.88)">Natural</button><button onclick="speak('${l.sentence}',.55)">Natural Slow</button></div>`}}
function renderDrawer(){if(selected===null){drawer.innerHTML='<div class="empty"><b>🪆</b><p>単語に触れると、<br>中の構造が静かに開きます。</p></div>';return}const w=lessons[lessonIndex].words[selected];drawer.innerHTML=`<div class="crumb"><button onclick="selected=null;renderWorld();renderDrawer()">Sentence</button><span>›</span><b>${w[0]}</b></div><button class="drawer-word" onclick="speak('${w[0]}')">${stress?w[1]:w[0]}<span>↗</span></button><p class="drawer-meaning">${w[3]}</p><dl><div><dt>Dictionary form</dt><dd>${w[2]}</dd></div><div><dt>Form</dt><dd>${w[4]}</dd></div>${w[6]?`<div><dt>Case</dt><dd>${w[6]}</dd></div>`:''}<div><dt>In this sentence</dt><dd>${w[5]}</dd></div></dl>${w[7]?`<div class="card"><small>DISCOVERY</small><p>${w[7]}</p></div>`:''}${w[8]?`<div class="card"><small>ASPECT PERSPECTIVE</small><p><button onclick="speak('${w[8][0]}')">${w[8][0]}</button> ↔ <button onclick="speak('${w[8][1]}')">${w[8][1]}</button></p><p>${w[8][2]}</p></div>`:''}<button class="deeper" onclick="this.outerHTML='<div class=card><small>FORM NETWORK</small><p>${w[2]} から、この文に必要な形として <b>${w[0]}</b> が選ばれています。</p></div>'">この形をさらに開く　→</button>`}
function openForms(button){const w=lessons[lessonIndex].words[selected],forms=formNetworks[w[2]];button.outerHTML=`<div class="card"><small>FORM NETWORK</small><p>${w[2]} の各語形。形そのものを押すと音が鳴ります。</p><div class="forms">${forms.map(f=>`<div class="form-row"><span>${f[0]}</span><button onclick="speak('${f[1]}');remember('form:${f[1]}')">${f[1]}</button></div>`).join('')}</div></div>`}
document.addEventListener('click',event=>{const button=event.target.closest&&event.target.closest('.deeper');if(!button)return;const w=lessons[lessonIndex].words[selected];if(formNetworks[w[2]]){event.preventDefault();event.stopImmediatePropagation();openForms(button)}},true);
function renderTokens(){tokens.innerHTML=mytext.value.trim().split(/\s+/).filter(Boolean).map(t=>`<button onclick="speak('${t.replace(/[.,!?]/g,'')}')">${t}</button>`).join('')}mytext.addEventListener('input',renderTokens);
function renderMap(){const groups=[['Cases','Dative · Recipient','Dative · Experiencer','Accusative · Object'],['Aspect','Activity · Inside','Bounded event · Whole','Result'],['Sound','Stress','Connected speech','Sentence rhythm']];mapgrid.innerHTML=groups.map((g,j)=>`<article><small>0${j+1}</small><h2>${g[0]}</h2>${g.slice(1).map((x,i)=>`<div class="mapitem"><i style="opacity:${Math.min(.25+(Object.keys(encounters).length+i)*.06,1)}"></i><span>${x}</span></div>`).join('')}</article>`).join('');encounter.textContent=`この端末で触れた入口：${Object.keys(encounters).length}か所。ここには「習得済み」も「苦手」もありません。`}
const renderWorldBase=renderWorld;
renderWorld=function(){renderWorldBase();const l=lessons[lessonIndex],label=world.querySelector(':scope > label');if(!label)return;const scene=document.createElement('button');scene.className='situation';scene.setAttribute('aria-label','状況から文全体を聞く');scene.innerHTML=`<small>SCENE</small><span>${situationScenes[l.id]}</span>`;scene.onclick=()=>{speak(l.sentence);remember('scene:'+l.id)};world.insertBefore(scene,label)};
render();renderTokens();setLayer(layer);showScreen(activeScreen);
</script></body></html>
