<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Russian Structure Lab</title>
<style>
:root{--ink:#18211e;--muted:#707773;--paper:#f3f0e8;--cream:#fbfaf6;--green:#285e50;--line:#d8d5cc;--red:#af4b3a;--gold:#a98a4e;--focus:#fff3c9}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif}button,a{font:inherit;color:inherit}button{cursor:pointer}header{min-height:68px;padding:10px 4vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;background:#f3f0e8ee;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:11px;text-decoration:none}.mark{width:38px;height:38px;border:1px solid;border-radius:50%;display:grid;place-items:center;font:21px Georgia,serif}.brand strong{display:block;font:17px Georgia,serif}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.16em}nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}nav a{text-decoration:none;border:1px solid var(--line);background:var(--cream);border-radius:18px;padding:8px 11px;font-size:10px}.shell{display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:calc(100vh - 68px)}main{padding:24px 5vw 30px;min-width:0}.side{border-left:1px solid var(--line);background:var(--cream);padding:28px 24px;overflow:auto}.levelbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.levelbar button{border:1px solid var(--line);background:var(--cream);padding:9px 12px;border-radius:20px;font-weight:700}.levelbar button.on{background:var(--ink);color:#fff}.levelbar button.empty{opacity:.45}.categorybar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}.categorybar button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:6px 9px;border-bottom:2px solid transparent}.categorybar button.on{color:var(--green);border-color:var(--green)}.status{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:10px;border-top:1px solid var(--line);padding-top:10px}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:17px 0}.flow button{border:1px solid var(--line);background:var(--cream);padding:10px 6px;border-radius:12px;font-size:11px;color:var(--muted)}.flow button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.flow button b{display:block;font-size:17px;margin-bottom:2px}.world{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.eyebrow{color:var(--muted);font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}.situationCard{max-width:760px;border:1px solid var(--line);background:var(--cream);padding:28px 24px;border-radius:24px}.situationEmoji{font-size:54px;margin-bottom:14px}.situationText{font:clamp(26px,4vw,46px)/1.35 Georgia,serif}.situationHint{color:var(--muted);margin-top:15px;line-height:1.7}.words{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;max-width:850px}.words button{border:0;background:transparent;padding:5px 2px 10px;font:clamp(34px,5vw,64px)/1.15 Georgia,serif}.words button.on{color:var(--red);border-bottom:2px solid var(--red)}.meaning{border:0;border-bottom:1px solid #aaa;background:transparent;color:var(--muted);margin-top:30px;padding:7px}.whole{border:0;background:transparent;font:clamp(30px,4vw,54px)/1.45 Georgia,serif;padding:10px;max-width:900px}.chunks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}.chunks span{border-top:3px solid var(--green);background:#ffffff88;padding:10px 13px;font:17px Georgia,serif}.audioStack{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.audioStack button{border:1px solid var(--line);background:var(--cream);padding:14px 18px;border-radius:18px}.regrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(900px,100%)}.recard{border:1px solid var(--line);background:var(--cream);padding:16px;text-align:left}.recard small{display:block;color:var(--muted);margin-bottom:7px}.recard b{display:block;font:22px Georgia,serif;margin-bottom:8px}.recard p{margin:0;color:var(--muted);font-size:12px}.controls{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}.controls button{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:transparent}.controls span{color:var(--muted);font-size:9px;letter-spacing:.1em}.emptySide{min-height:400px;display:grid;place-content:center;text-align:center;color:var(--muted)}.focus small{color:var(--muted);font-size:8px;letter-spacing:.14em}.focus h2{font:36px Georgia,serif;margin:7px 0 12px}.focus .jp{font-size:18px;margin-bottom:20px}.row{border-top:1px solid var(--line);padding:11px 0}.row small{display:block;color:var(--muted);font-size:8px}.row b{font-size:12px}.card{margin-top:14px;padding:14px;background:#edf0e9;border-left:3px solid var(--green);font-size:11px;line-height:1.7}.warn{background:#f2eee4;border-color:var(--gold)}.noData{min-height:430px;display:grid;place-content:center;text-align:center}.noData b{font:42px Georgia,serif}.noData p{color:var(--muted);line-height:1.8}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line)}header{align-items:flex-start}.brand small{display:none}.regrid{grid-template-columns:1fr}}@media(max-width:560px){header{padding:9px 13px}.mark{width:34px;height:34px}.brand strong{font-size:14px}nav a{padding:7px 8px}.shell{min-height:calc(100vh - 60px)}main{padding:18px 14px}.levelbar{gap:5px}.levelbar button{padding:8px 10px}.flow{gap:4px}.flow button{padding:8px 2px;font-size:9px}.flow button b{font-size:15px}.world{min-height:370px}.words button{font-size:37px}.side{padding:22px 18px}}
</style>
</head><body>
<header><a class="brand" href="index.html"><span class="mark">Я</span><span><strong>Russian Structure Lab</strong><small>SITUATION-FIRST LEARN</small></span></a><nav><a href="my-material.html">🪆 My Material</a><a href="level-browser.html">📚 Curriculum</a><a href="legacy-index.html">🕰 Legacy</a></nav></header>
<div class="shell"><main>
<div class="levelbar" id="levels"></div><div class="categorybar" id="categories"></div><div class="status"><span id="scope"></span><span id="counter"></span></div>
<div class="flow" id="flow">
<button data-step="situation" onclick="setStep('situation')"><b>🎭</b>Situation</button>
<button data-step="words" onclick="setStep('words')"><b>🔤</b>Words</button>
<button data-step="sentence" onclick="setStep('sentence')"><b>🏗️</b>Sentence</button>
<button data-step="audio" onclick="setStep('audio')"><b>🎧</b>Audio</button>
<button data-step="reencounter" onclick="setStep('reencounter')"><b>🗺️</b>Re-encounter</button>
</div>
<div id="world" class="world"></div><div class="controls"><button onclick="move(-1)">←</button><span>🎭 → 🔤 → 🏗️ → 🎧 → 🗺️</span><button onclick="move(1)">→</button></div>
</main><aside class="side" id="drawer"></aside></div>
<script src="curriculum.js"></script><script src="materials.js"></script><script src="materials-a1-calibration.js"></script><script src="material-engine.js"></script>
<script>
const C=window.RSL_CURRICULUM, E=window.RSL_MATERIAL_ENGINE;
const icons={A1:'🌱',A2:'🌿',B1:'🌳',B2:'🌲',C1:'🏛️',C2:'🌌',UNCLASSIFIED:'🗃️'};
const catScene={DL:['🏠','日常の中で言いたいこと'],PR:['👥','人との関係の中で言いたいこと'],WS:['💼','仕事・勉強の場面'],TM:['🚆','移動している場面'],FS:['🍽️','食事・買い物の場面'],BE:['❤️','体や気持ちを伝える場面'],NE:['🌦️','天気や自然について話す場面'],SI:['📰','情報や連絡の場面'],TO:['🧠','考えや理解を伝える場面'],CE:['🎭','文化や表現に触れる場面']};
let state={level:'A1',category:null,index:0,step:'situation',selected:null,meaning:false};
try{state={...state,...JSON.parse(localStorage.getItem('rsl-canonical-state')||'{}')}}catch{}
const q=new URLSearchParams(location.search);if(q.get('level'))state.level=q.get('level');if(q.has('category'))state.category=q.get('category')||null;if(q.get('step'))state.step=q.get('step');state.index=0;
function save(){localStorage.setItem('rsl-canonical-state',JSON.stringify(state))}
function clean(s){return String(s||'').replace(/[.,!?—:;«»“”]/g,'')}
function dataset(){return state.level==='UNCLASSIFIED'?E.getByLevel('UNCLASSIFIED'):E.getByCategory(state.level,state.category)}
function current(){const d=dataset();if(!d.length)return null;state.index=Math.max(0,Math.min(state.index,d.length-1));return d[state.index]}
function displayWords(m){if(m.words&&m.words.length)return m.words.map(w=>({surface:clean(w.surface||''),stressed:w.surface||'',lemma:w.lemma||'',jp:w.jp||''}));return clean(m.ru).split(/\s+/).filter(Boolean).map(x=>({surface:x,stressed:x,lemma:'',jp:''}))}
function speech(t,rate=.88){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t==='Я'?'я':t);u.lang='ru-RU';u.rate=rate;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()==='ru-ru')||vs.find(v=>v.lang.toLowerCase().startsWith('ru'))||null;speechSynthesis.speak(u)}
function renderNav(){const stats=E.stats().levels;levels.innerHTML=[...C.levels,'UNCLASSIFIED'].map(l=>`<button class="${state.level===l?'on ':''}${stats[l]===0?'empty':''}" onclick="chooseLevel('${l}')">${icons[l]} ${l==='UNCLASSIFIED'?'Legacy':l} <small>${stats[l]}</small></button>`).join('');categories.innerHTML=state.level==='UNCLASSIFIED'?'<button class="on">旧教材・未分類</button>':`<button class="${!state.category?'on':''}" onclick="chooseCategory(null)">All</button>`+C.categories.map(c=>`<button class="${state.category===c.code?'on':''}" onclick="chooseCategory('${c.code}')">${c.emoji} ${c.name}</button>`).join('')}
function chooseLevel(l){state.level=l;state.category=null;state.index=0;state.selected=null;state.step='situation';render();save()}
function chooseCategory(c){state.category=c;state.index=0;state.selected=null;state.step='situation';render();save()}
function setStep(s){state.step=s;state.selected=null;render();save()}
function move(n){const d=dataset();if(!d.length)return;state.index=(state.index+n+d.length)%d.length;state.selected=null;state.meaning=false;state.step='situation';render();save()}
function sceneFor(m){if(m.scene)return {emoji:'🎭',text:m.scene};const c=catScene[m.category]||['🎭','このロシア語を使う場面'];return {emoji:c[0],text:c[1]}}
function overlapScore(a,b){const wa=new Set(displayWords(a).map(x=>clean(x.surface).toLowerCase()).filter(x=>x.length>2));const wb=displayWords(b).map(x=>clean(x.surface).toLowerCase());return wb.filter(x=>wa.has(x)).length}
function reEncounters(m){return E.getByLevel(m.level).filter(x=>x.id!==m.id).map(x=>({x,score:overlapScore(m,x)})).filter(o=>o.score>0).sort((a,b)=>b.score-a.score).slice(0,4).map(o=>o.x)}
function render(){renderNav();document.querySelectorAll('#flow button').forEach(b=>b.classList.toggle('on',b.dataset.step===state.step));const d=dataset(),m=current();scope.textContent=state.level==='UNCLASSIFIED'?'🗃️ Legacy':`${icons[state.level]} ${state.level}${state.category?' · '+state.category:''}`;counter.textContent=d.length?`${state.index+1} / ${d.length}`:`0 / ${C.perLevel}`;if(!m){world.innerHTML=`<div class="noData"><b>${icons[state.level]} ${state.level}</b><p>このレベルは選択できます。<br>教材データはまだ登録されていません。</p></div>`;drawer.innerHTML='<div class="emptySide">📍<br>教材が追加されると<br>ここから深く開けます。</div>';return}renderWorld();renderDrawer()}
function renderWorld(){const m=current(),ws=displayWords(m),scene=sceneFor(m);if(state.step==='situation'){world.innerHTML=`<div class="eyebrow">🎭 Situation</div><div class="situationCard"><div class="situationEmoji">${scene.emoji}</div><div class="situationText">${scene.text}</div><div class="situationHint">まず「何を言いたい場面なのか」を掴みます。まだ文法説明は出しません。</div></div>`;return}
if(state.step==='words'){world.innerHTML=`<div class="eyebrow">🔤 Words · tap = sound</div><div class="words" lang="ru">${ws.map((w,i)=>`<button class="${state.selected===i?'on':''}" onclick="selectWord(${i})">${w.stressed||w.surface}</button>`).join('')}</div><button class="meaning" onclick="state.meaning=!state.meaning;renderWorld()">${state.meaning?(m.jp||'意味は未登録'):'意味を見る'}</button>`;return}
if(state.step==='sentence'){const cs=m.chunks&&m.chunks.length?m.chunks:[];world.innerHTML=`<div class="eyebrow">🏗️ Sentence</div><button class="whole" onclick='speech(${JSON.stringify(m.ru)})'>${m.ru}</button>${cs.length?`<div class="chunks">${cs.map(c=>`<span>${c.ru||c}</span>`).join('')}</div>`:''}<button class="meaning" onclick="state.meaning=!state.meaning;renderWorld()">${state.meaning?(m.jp||'意味は未登録'):'意味を見る'}</button>`;return}
if(state.step==='audio'){world.innerHTML=`<div class="eyebrow">🎧 Audio</div><button class="whole" onclick='speech(${JSON.stringify(m.ru)},.9)'>${m.ru}</button><div class="audioStack"><button onclick='speech(${JSON.stringify(m.ru)},.9)'>🎧 Natural</button><button onclick='speech(${JSON.stringify(m.ru)},.68)'>🐢 Natural Slow</button><button onclick='speech(${JSON.stringify(m.ru)},.52)'>🔬 Study</button></div>`;return}
const rs=reEncounters(m);world.innerHTML=`<div class="eyebrow">🗺️ Re-encounter</div>${rs.length?`<div class="regrid">${rs.map(x=>`<button class="recard" onclick="jumpTo('${x.id}')"><small>${x.category||''} · shared language</small><b>${x.ru}</b><p>${x.jp||''}</p></button>`).join('')}</div>`:`<div class="situationCard"><div class="situationEmoji">🗺️</div><div class="situationText">まだ再遭遇リンクがありません</div><div class="situationHint">教材が増えるほど、同じ語・chunk・structureが別のSituationで再登場します。</div></div>`}`}
function jumpTo(id){const target=E.getById(id);if(!target)return;state.level=target.level;state.category=target.category;const d=dataset();state.index=Math.max(0,d.findIndex(x=>x.id===id));state.step='situation';state.selected=null;render();save()}
function selectWord(i){state.selected=i;const w=displayWords(current())[i];speech(w.surface);renderWorld();renderDrawer();save()}
function renderDrawer(){const m=current();if(!m)return;if(state.selected===null){drawer.innerHTML=`<div class="emptySide"><div><b>🪆</b><p>表側はシンプルに進みます。<br>単語をタップすると、ここで<br>📐 Case / 🔄 Aspect / 🧬 Anatomyへ潜れます。</p><small>${m.id} · ${m.verification}</small></div></div>`;return}const w=displayWords(m)[state.selected];drawer.innerHTML=`<div class="focus"><small>📍 CURRENT FOCUS</small><h2 lang="ru">${w.surface}</h2><div class="jp">${w.jp||'意味データは未登録'}</div><div class="row"><small>LEMMA</small><b>${w.lemma||'未解析'}</b></div><div class="row"><small>SOURCE</small><b>${m.source} · ${m.verification}</b></div>${m.caseFocus&&m.caseFocus.length?`<div class="card">📐 Case: ${m.caseFocus.join(' · ')}</div>`:''}${m.aspectFocus?`<div class="card">🔄 Aspect: ${m.aspectFocus.impf||'—'} ↔ ${m.aspectFocus.pf||'—'}</div>`:''}${m.anatomyFocus?`<div class="card warn">🧬 Word Anatomy available</div>`:''}<div class="card">🌳 Word Family / 🧠 Meaning Network は、この語を起点に今後さらに接続します。</div></div>`}
render();
</script></body></html>
