<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Russian Structure Lab — v1 Redesign Prototype</title>
<style>
:root{--ink:#18211e;--muted:#747a76;--paper:#f3f0e8;--cream:#fbfaf6;--line:#d8d5cc;--green:#285e50;--red:#a94c3a;--blue:#5f7f94;--gold:#aa8c52;--shadow:0 18px 50px #1d29220f}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--green);outline-offset:3px}.ru{font-family:Georgia,"Times New Roman",serif}header{position:sticky;top:0;z-index:20;height:72px;padding:0 max(16px,4vw);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#f3f0e8ed;backdrop-filter:blur(14px)}.brand{border:0;background:none;display:flex;align-items:center;gap:11px;padding:0}.brandmark{width:38px;height:38px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:21px Georgia,serif}.brand strong{display:block;font:17px Georgia,serif}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:8px;letter-spacing:.19em;text-transform:uppercase}.right{display:flex;gap:8px;align-items:center}.lang{display:flex;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--cream)}.lang button{border:0;background:none;padding:9px 12px;font-size:12px}.lang button.on{background:var(--ink);color:#fff}.gear{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--cream)}main{min-height:calc(100vh - 72px);display:grid;grid-template-columns:minmax(0,1fr) 360px}.stage{padding:28px max(18px,5vw) 26px;min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:9px;letter-spacing:.15em;text-transform:uppercase}.situation{display:inline-flex;align-items:center;gap:12px;margin-top:18px;padding:9px 16px;border:1px solid var(--line);border-radius:30px;background:var(--cream);box-shadow:var(--shadow)}.situation b{font-size:23px}.situation span{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}.layers{display:flex;justify-content:center;align-items:center;margin:28px auto 10px}.layers button{border:0;background:none;padding:8px 12px;color:#9a9f9b;font-size:10px;letter-spacing:.13em;text-transform:uppercase}.layers button.on{color:var(--green)}.layers i{font:normal 15px Georgia,serif;margin-right:5px}.layers em{width:38px;height:1px;background:var(--line)}#world{min-height:455px;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:rise .22s ease}@keyframes rise{from{opacity:.25;transform:translateY(5px)}}.hint{font-size:10px;color:#969b97;margin-bottom:26px}.words{max-width:900px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 19px}.word{position:relative;border:0;background:none;padding:10px 2px 15px;font:clamp(36px,5vw,66px)/1.08 Georgia,serif}.word.playing,.chunk.playing,.sentenceBtn.playing{color:var(--red);transform:translateY(-1px)}.word:after{content:"";position:absolute;height:2px;bottom:6px;left:50%;width:0;background:var(--red);transition:.18s}.word.playing:after,.word.open:after{left:0;width:100%}.reveal{margin-top:28px;border:0;border-bottom:1px solid #aeb4af;background:none;color:var(--muted);padding:7px 2px;font-size:11px}.chunks{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:850px}.chunk{min-width:155px;max-width:270px;text-align:left;border:1px solid var(--line);background:var(--cream);padding:20px;box-shadow:0 8px 26px #19251e08;transition:.16s}.chunk strong{display:block;font:26px/1.25 Georgia,serif}.chunk span{display:block;margin-top:11px;font-size:12px}.chunk small{display:block;margin-top:7px;color:var(--muted);font-size:9px}.sentenceWrap{text-align:center;max-width:820px}.sentenceBtn{border:0;background:none;padding:12px;font:clamp(31px,4.3vw,57px)/1.25 Georgia,serif}.translation{margin:23px auto 0;max-width:670px;font-size:13px;line-height:1.8;color:#59615d}.arch{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:30px}.arch button{min-width:110px;text-align:left;border:0;border-top:3px solid;background:#ffffff85;padding:11px 14px}.arch small{display:block;font-size:8px;color:var(--muted);letter-spacing:.12em}.arch b{display:block;margin-top:5px;font:18px Georgia,serif}.nom{border-color:var(--blue)!important}.verb{border-color:var(--red)!important}.acc{border-color:var(--gold)!important}.dat{border-color:var(--green)!important}.controls{display:flex;align-items:center;justify-content:space-between;padding-top:18px;border-top:1px solid var(--line)}.controls button{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:transparent}.controls span{font-size:9px;letter-spacing:.15em;color:var(--muted)}aside{border-left:1px solid var(--line);background:var(--cream);padding:30px 27px;overflow:auto}.empty{min-height:430px;height:100%;display:grid;place-content:center;text-align:center;color:#969b97}.empty b{font-size:30px;opacity:.5}.empty p{font-size:11px;line-height:1.8}.crumb{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:9px}.crumb button{border:0;background:none;padding:0;color:var(--green)}.drawerTitle{width:100%;display:flex;justify-content:space-between;align-items:flex-end;border:0;border-bottom:1px solid var(--line);background:none;padding:23px 0 14px;font:41px Georgia,serif}.drawerTitle small{font:10px Arial;color:var(--muted)}.ipa{margin:11px 0 3px;font:14px Georgia,serif;color:#4d5752}.meaning{font-size:18px;margin:16px 0 22px}dl{margin:0}dl div{display:grid;grid-template-columns:105px 1fr;gap:12px;padding:11px 0;border-top:1px solid #e8e5dd}dt{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}dd{margin:0;font-size:12px;line-height:1.55}.card{margin-top:18px;padding:16px;background:#edf0e9;border-left:3px solid var(--green)}.card.red{border-color:var(--red);background:#f4ece8}.card small{display:block;color:var(--green);font-size:8px;letter-spacing:.14em;text-transform:uppercase}.card.red small{color:var(--red)}.pair{display:flex;align-items:center;gap:10px;margin:10px 0}.pair button{border:0;border-bottom:1px solid #98a79f;background:none;padding:3px 0;font:18px Georgia,serif}.card p{font-size:11px;line-height:1.7;margin:8px 0 0}.forms{margin-top:15px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;border-top:1px solid #e7e4dc;padding:9px 0}.formrow span{font-size:9px;color:var(--muted)}.formrow button{border:0;background:none;text-align:left;font:17px Georgia,serif}.settings{position:fixed;right:18px;top:82px;z-index:40;width:270px;padding:18px;background:var(--cream);border:1px solid var(--line);box-shadow:var(--shadow);display:none}.settings.on{display:block}.settings h3{font:18px Georgia,serif;margin:0 0 14px}.setting{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:11px 0;font-size:11px}.setting button{border:1px solid var(--line);background:var(--paper);padding:5px 9px;border-radius:16px;font-size:10px}@media(max-width:880px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line);min-height:360px}.stage{padding-bottom:18px}}@media(max-width:560px){header{height:66px;padding:0 13px}.brand strong{font-size:14px}.brand small{display:none}.lang button{padding:8px 9px;font-size:11px}main{min-height:calc(100vh - 66px)}.stage{padding:22px 14px}.situation{margin-top:13px}.layers em{width:18px}.layers button{font-size:8px;padding:7px}.words{gap:5px 13px}.word{font-size:38px}.chunk{min-width:140px;padding:17px}.controls span{font-size:7px}aside{padding:25px 20px}}
</style>
</head>
<body>
<header>
  <button class="brand" onclick="resetView()"><span class="brandmark">Я</span><span><strong>Russian</strong><small>Structure Lab · v1 prototype</small></span></button>
  <div class="right"><div class="lang"><button id="jpBtn" class="on" onclick="setLang('jp')">🇯🇵 日本語</button><button id="enBtn" onclick="setLang('en')">🇬🇧 English</button></div><button class="gear" onclick="toggleSettings()">⋯</button></div>
</header>
<main>
<section class="stage">
  <div class="topline"><span id="context">AFTER WORK · AT HOME</span><span>PROTOTYPE 01</span></div>
  <div class="situation"><b>🏠 📕 👩</b><span id="situationText">本を妹に渡した場面</span></div>
  <div class="layers"><button id="tabWords" class="on" onclick="setLayer('words')"><i>01</i> Words</button><em></em><button id="tabChunks" onclick="setLayer('chunks')"><i>02</i> Chunks</button><em></em><button id="tabSentence" onclick="setLayer('sentence')"><i>03</i> Sentence</button></div>
  <div id="world"></div>
  <div class="controls"><button onclick="setLayer(previousLayer())">←</button><span id="motto">見る · 触る · 聞く · 開く · 発見する</span><button onclick="setLayer(nextLayer())">→</button></div>
</section>
<aside id="drawer"></aside>
</main>
<div id="settings" class="settings"><h3>Sound & Script</h3><div class="setting"><span>IPA</span><button id="ipaToggle" onclick="toggleIpa()">ON</button></div><div class="setting"><span>Stress marks</span><button id="stressToggle" onclick="toggleStress()">AUTO</button></div><div class="setting"><span>Slow speech</span><button onclick="speak(sentence.text,.68)">Play</button></div></div>
<script>
const sentence={
 text:'Я дал книгу своей младшей сестре.',stress:'Я дал кни́гу свое́й мла́дшей сестре́.',
 jp:'私は自分の妹に本を渡しました。',en:'I gave a book to my younger sister.',
 words:[
 {t:'Я',s:'Я',ipa:'/ja/',lemma:'я',jp:'私',en:'I',formJ:'代名詞・単数・主格',formE:'pronoun · singular · nominative',roleJ:'渡した人',roleE:'giver / subject',caseJ:'主格 / Nominative',caseE:'Nominative',whyJ:'文の動作主。',whyE:'Marks the participant who performs the action.'},
 {t:'дал',s:'дал',ipa:'/dal/',lemma:'дать',jp:'渡した・与えた',en:'gave',formJ:'過去・男性・単数',formE:'past · masculine · singular',roleJ:'中心となる出来事',roleE:'main event',aspect:{imp:'давать',perf:'дать',jp:'出来事を境界のある一まとまりとして見ています。давать は行為の内部・反復などを見やすく、дать は一回のまとまりとして捉えます。',en:'The event is viewed as a bounded whole. давать commonly opens the event from the inside or as repetition; дать presents it as a bounded event.'}},
 {t:'книгу',s:'кни́гу',ipa:'/ˈknʲiɡʊ/',lemma:'книга',jp:'本を',en:'a book',formJ:'女性・単数・対格',formE:'feminine · singular · accusative',roleJ:'渡されたもの',roleE:'thing transferred',caseJ:'対格 / Accusative',caseE:'Accusative',whyJ:'дать「与える」の対象なので対格。книга → книгу。',whyE:'The transferred thing is marked Accusative: книга → книгу.',forms:[['Nom','книга'],['Gen','книги'],['Dat','книге'],['Acc','книгу'],['Inst','книгой'],['Prep','книге']]},
 {t:'своей',s:'свое́й',ipa:'/svɐˈjej/',lemma:'свой',jp:'自分の',en:'one’s own',formJ:'女性・単数・与格',formE:'feminine · singular · dative',roleJ:'сестре と一致',roleE:'agrees with сестре',caseJ:'与格 / Dative',caseE:'Dative'},
 {t:'младшей',s:'мла́дшей',ipa:'/ˈmɫatʂɨj/',lemma:'младший',jp:'年下の',en:'younger',formJ:'女性・単数・与格',formE:'feminine · singular · dative',roleJ:'сестре と一致',roleE:'agrees with сестре',caseJ:'与格 / Dative',caseE:'Dative'},
 {t:'сестре',s:'сестре́',ipa:'/sʲɪˈstrʲe/',lemma:'сестра',jp:'姉・妹に',en:'to the sister',formJ:'女性・単数・与格',formE:'feminine · singular · dative',roleJ:'受け手 / Recipient',roleE:'recipient',caseJ:'与格 / Dative',caseE:'Dative',whyJ:'「誰に渡したか」という受け手を示すため与格。日本語の「〜に」に近いが、与格＝「に」ではありません。',whyE:'The recipient is marked Dative. English often expresses the same relation with word order or “to”, but Russian marks it on the noun.',forms:[['Nom','сестра'],['Gen','сестры'],['Dat','сестре'],['Acc','сестру'],['Inst','сестрой'],['Prep','сестре']]}
 ],
 chunks:[
 {t:'Я дал',jp:'私は渡した',en:'I gave',fnJ:'動作主＋出来事',fnE:'giver + event'},
 {t:'книгу',jp:'本を',en:'a book',fnJ:'渡されたもの',fnE:'thing transferred'},
 {t:'своей младшей сестре',jp:'自分の・年下の・姉妹に → 自分の妹に',en:'to one’s own younger sister',fnJ:'与格の受け手チャンク',fnE:'Dative recipient phrase'}
 ]
};
let lang='jp',layer='words',showIPA=true,stressMode='auto';const taps={};
const $=id=>document.getElementById(id);
function resetView(){layer='words';Object.keys(taps).forEach(k=>delete taps[k]);render();}
function setLang(v){lang=v;$('jpBtn').classList.toggle('on',v==='jp');$('enBtn').classList.toggle('on',v==='en');$('situationText').textContent=v==='jp'?'本を妹に渡した場面':'Giving a book to a younger sister';$('motto').textContent=v==='jp'?'見る · 触る · 聞く · 開く · 発見する':'See · Touch · Hear · Open · Discover';render();}
function setLayer(v){layer=v;['Words','Chunks','Sentence'].forEach(n=>$('tab'+n).classList.toggle('on',v===n.toLowerCase()));render();}
function previousLayer(){return layer==='sentence'?'chunks':'words'} function nextLayer(){return layer==='words'?'chunks':'sentence'}
function displayText(obj){return stressMode==='off'?obj.t:(stressMode==='on'?obj.s:(obj.playing?obj.s:obj.t));}
function tapWord(i,el){const key='w'+i;taps[key]=(taps[key]||0)+1;speak(sentence.words[i].t,1,el);if(taps[key]>=2){el.classList.add('open');openWord(i)}if(Object.values(taps).reduce((a,b)=>a+b,0)>=3&&layer==='words')setTimeout(()=>setLayer('chunks'),320)}
function tapChunk(i,el){const key='c'+i;taps[key]=(taps[key]||0)+1;speak(sentence.chunks[i].t,1,el);if(taps[key]>=2)openChunk(i)}
let pressTimer=null;function sentenceDown(){pressTimer=setTimeout(()=>{speak(sentence.text,.68,$('sentenceButton'));pressTimer='done'},550)}function sentenceUp(){if(pressTimer&&pressTimer!=='done'){clearTimeout(pressTimer);const key='sent';taps[key]=(taps[key]||0)+1;speak(sentence.text,1,$('sentenceButton'));if(taps[key]>=2)openSentence()}pressTimer=null}
function speak(text,rate=1,el){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=rate;if(el){el.classList.add('playing');u.onend=()=>{el.classList.remove('playing');renderStressOnly()}}speechSynthesis.speak(u);renderStressOnly(el)}
function renderStressOnly(){}
function render(){if(layer==='words')renderWords();if(layer==='chunks')renderChunks();if(layer==='sentence')renderSentence();if(!$('drawer').dataset.lock)$('drawer').innerHTML=emptyDrawer();}
function renderWords(){$('world').innerHTML=`<div class="hint">${lang==='jp'?'1回タップ＝音 · もう一度＝意味と構造':'Tap once = sound · tap again = meaning & structure'}</div><div class="words">${sentence.words.map((w,i)=>`<button class="word" onclick="tapWord(${i},this)">${stressMode==='on'?w.s:w.t}</button>`).join('')}</div><button class="reveal" onclick="setLayer('chunks')">${lang==='jp'?'意味のかたまりを見る':'See meaning chunks'} ↓</button>`}
function renderChunks(){$('world').innerHTML=`<div class="hint">${lang==='jp'?'チャンクそのものを押すと、そのまとまりの音が鳴ります':'Tap the chunk itself to hear it as one unit'}</div><div class="chunks">${sentence.chunks.map((c,i)=>`<button class="chunk" onclick="tapChunk(${i},this)"><strong class="ru">${c.t}</strong><span>${lang==='jp'?c.jp:c.en}</span><small>${lang==='jp'?c.fnJ:c.fnE}</small></button>`).join('')}</div><button class="reveal" onclick="setLayer('sentence')">${lang==='jp'?'文全体へ':'Open the sentence'} ↓</button>`}
function renderSentence(){$('world').innerHTML=`<div class="sentenceWrap"><div class="hint">${lang==='jp'?'タップ＝Natural · 長押し＝Slow · 再タップ＝構造':'Tap = Natural · hold = Slow · tap again = structure'}</div><button id="sentenceButton" class="sentenceBtn" onpointerdown="sentenceDown()" onpointerup="sentenceUp()" onpointerleave="sentenceUp()">${stressMode==='on'?sentence.stress:sentence.text}</button><p class="translation">${lang==='jp'?sentence.jp:sentence.en}</p><div class="arch"><button class="nom" onclick="openWord(0)"><small>NOMINATIVE</small><b>Я</b></button><button class="verb" onclick="openWord(1)"><small>ASPECT / VERB</small><b>дал</b></button><button class="acc" onclick="openWord(2)"><small>ACCUSATIVE</small><b>книгу</b></button><button class="dat" onclick="openWord(5)"><small>DATIVE · RECIPIENT</small><b>сестре</b></button></div></div>`}
function openWord(i){const w=sentence.words[i];$('drawer').dataset.lock='1';$('drawer').innerHTML=`<div class="crumb"><button onclick="closeDrawer()">Sentence</button><span>›</span><span>${w.t}</span></div><button class="drawerTitle" onclick="speak('${w.t}',1,this)">${w.s}<small>tap = sound</small></button>${showIPA?`<div class="ipa">${w.ipa}</div>`:''}<div class="meaning">${lang==='jp'?w.jp:w.en}</div><dl><div><dt>${lang==='jp'?'辞書形':'Lemma'}</dt><dd><button style="border:0;background:none;padding:0;font:18px Georgia" onclick="speak('${w.lemma}',1,this)">${w.lemma}</button></dd></div><div><dt>${lang==='jp'?'語形':'Form'}</dt><dd>${lang==='jp'?w.formJ:w.formE}</dd></div><div><dt>${lang==='jp'?'文中の役割':'Function'}</dt><dd>${lang==='jp'?w.roleJ:w.roleE}</dd></div>${w.caseJ?`<div><dt>Case</dt><dd><button style="border:0;background:none;padding:0;color:var(--green)" onclick="openCase(${i})">${lang==='jp'?w.caseJ:w.caseE} →</button></dd></div>`:''}</dl>${w.aspect?aspectCard(w):''}${w.whyJ?`<div class="card"><small>${lang==='jp'?'WHY THIS FORM':'WHY THIS FORM'}</small><p>${lang==='jp'?w.whyJ:w.whyE}</p></div>`:''}${w.forms?formsBlock(w):''}`}
function aspectCard(w){return `<div class="card red"><small>ASPECT</small><div class="pair"><button onclick="speak('${w.aspect.imp}',1,this)">${w.aspect.imp}</button><span>↔</span><button onclick="speak('${w.aspect.perf}',1,this)">${w.aspect.perf}</button></div><p>${lang==='jp'?w.aspect.jp:w.aspect.en}</p></div>`}
function formsBlock(w){return `<div class="forms">${w.forms.map(f=>`<div class="formrow"><span>${f[0]}</span><button onclick="speak('${f[1]}',1,this)">${f[1]}</button></div>`).join('')}</div>`}
function openCase(i){const w=sentence.words[i];$('drawer').dataset.lock='1';$('drawer').innerHTML=`<div class="crumb"><button onclick="closeDrawer()">Sentence</button><span>›</span><button onclick="openWord(${i})">${w.t}</button><span>›</span><span>${lang==='jp'?w.caseJ:w.caseE}</span></div><h2 style="font:30px Georgia;margin:28px 0 12px">${lang==='jp'?w.caseJ:w.caseE}</h2><div class="card"><small>${lang==='jp'?'この文での機能':'FUNCTION HERE'}</small><p>${lang==='jp'?(w.whyJ||w.roleJ):(w.whyE||w.roleE)}</p></div>${w.forms?formsBlock(w):''}`}
function openChunk(i){const c=sentence.chunks[i];$('drawer').dataset.lock='1';$('drawer').innerHTML=`<div class="crumb"><button onclick="closeDrawer()">Sentence</button><span>›</span><span>Chunk</span></div><button class="drawerTitle" onclick="speak('${c.t}',1,this)">${c.t}<small>tap = sound</small></button><div class="meaning">${lang==='jp'?c.jp:c.en}</div><div class="card"><small>${lang==='jp'?'文中の役割':'FUNCTION'}</small><p>${lang==='jp'?c.fnJ:c.fnE}</p></div><p style="font-size:11px;color:var(--muted);line-height:1.7">${lang==='jp'?'このチャンクを構成する単語も Words 画面から個別に開けます。':'Each word inside this chunk can also be opened individually from Words.'}</p>`}
function openSentence(){$('drawer').dataset.lock='1';$('drawer').innerHTML=`<div class="crumb"><button onclick="closeDrawer()">Sentence</button><span>›</span><span>Architecture</span></div><h2 style="font:29px Georgia;margin:27px 0 13px">Sentence Architecture</h2><div class="card"><small>${lang==='jp'?'ロシア語の関係':'RUSSIAN RELATIONS'}</small><p>${lang==='jp'?'Я＝主格の動作主、книгу＝対格の対象、сестре＝与格の受け手。語順だけではなく語形が関係を運びます。':'Я is the Nominative giver, книгу the Accusative thing transferred, and сестре the Dative recipient. Russian carries these relations in word forms, not only in word order.'}</p></div><div class="card red"><small>ASPECT</small><p>${lang==='jp'?'дал は дать の過去形。давать ↔ дать の関係から、出来事をどう切り取るかを見ることができます。':'дал is the past form of дать. The дава́ть ↔ дать relation lets you inspect how Russian frames the event.'}</p></div>`}
function emptyDrawer(){return `<div class="empty"><b>🪆</b><p>${lang==='jp'?'ロシア語を押してください。<br>1回目は音。もう一度押すと中が開きます。':'Tap the Russian.<br>First comes sound. Tap again to open the structure.'}</p></div>`}
function closeDrawer(){delete $('drawer').dataset.lock;$('drawer').innerHTML=emptyDrawer()}
function toggleSettings(){$('settings').classList.toggle('on')}function toggleIpa(){showIPA=!showIPA;$('ipaToggle').textContent=showIPA?'ON':'OFF'}function toggleStress(){stressMode=stressMode==='auto'?'on':stressMode==='on'?'off':'auto';$('stressToggle').textContent=stressMode.toUpperCase();render()}render();
</script>
</body>
</html>
