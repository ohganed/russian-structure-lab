<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Russian Structure Lab</title>
<style>
:root{--ink:#18211e;--muted:#707773;--paper:#f3f0e8;--cream:#fbfaf6;--green:#285e50;--line:#d8d5cc;--red:#af4b3a;--gold:#a98a4e;--focus:#fff3c9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif}button,a{font:inherit;color:inherit}button{cursor:pointer}header{min-height:68px;padding:10px 4vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;background:#f3f0e8ee;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:11px;text-decoration:none}.mark{width:38px;height:38px;border:1px solid;border-radius:50%;display:grid;place-items:center;font:21px Georgia,serif}.brand strong{display:block;font:17px Georgia,serif}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.16em}nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}nav a{text-decoration:none;border:1px solid var(--line);background:var(--cream);border-radius:18px;padding:8px 11px;font-size:10px}.shell{display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:calc(100vh - 68px)}main{padding:26px 5vw 30px;min-width:0}.side{border-left:1px solid var(--line);background:var(--cream);padding:28px 24px;overflow:auto}.levelbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.levelbar button{border:1px solid var(--line);background:var(--cream);padding:9px 12px;border-radius:20px;font-weight:700}.levelbar button.on{background:var(--ink);color:#fff}.levelbar button.empty{opacity:.48}.categorybar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px}.categorybar button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:6px 9px;border-bottom:2px solid transparent}.categorybar button.on{color:var(--green);border-color:var(--green)}.status{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:10px;border-top:1px solid var(--line);padding-top:10px}.layers{display:flex;justify-content:center;align-items:center;gap:8px;margin:18px 0}.layers button{border:0;background:transparent;color:#999;padding:8px 10px}.layers button.on{color:var(--green);font-weight:700}.layers i{font-style:normal;font-family:Georgia,serif;margin-right:4px}.world{min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.scene{border:1px solid var(--line);background:var(--cream);border-radius:30px;padding:9px 17px;margin-bottom:24px;font-size:21px}.scene small{font-size:8px;color:var(--muted);margin-right:10px}.sentenceTitle{color:var(--muted);font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:20px}.words{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;max-width:850px}.words button{border:0;background:transparent;padding:5px 2px 10px;font:clamp(34px,5vw,64px)/1.15 Georgia,serif}.words button.on{color:var(--red);border-bottom:2px solid var(--red)}.meaning{border:0;border-bottom:1px solid #aaa;background:transparent;color:var(--muted);margin-top:30px;padding:7px}.chunks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.chunks button{border:1px solid var(--line);background:var(--cream);padding:19px;text-align:left;min-width:160px;max-width:280px}.chunks strong{display:block;font:25px Georgia,serif;margin-bottom:9px}.chunks span{font-size:12px}.whole{border:0;background:transparent;font:clamp(30px,4vw,54px)/1.45 Georgia,serif;padding:10px}.architecture{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:25px}.architecture div{border-top:3px solid var(--green);background:#ffffff88;padding:10px 13px}.architecture small{display:block;color:var(--muted);font-size:8px}.architecture b{font:17px Georgia,serif}.controls{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}.controls button{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:transparent}.controls span{color:var(--muted);font-size:9px;letter-spacing:.12em}.emptySide{min-height:400px;display:grid;place-content:center;text-align:center;color:var(--muted)}.focus small{color:var(--muted);font-size:8px;letter-spacing:.14em}.focus h2{font:36px Georgia,serif;margin:7px 0 12px}.focus .jp{font-size:18px;margin-bottom:20px}.row{border-top:1px solid var(--line);padding:11px 0}.row small{display:block;color:var(--muted);font-size:8px}.row b{font-size:12px}.card{margin-top:14px;padding:14px;background:#edf0e9;border-left:3px solid var(--green);font-size:11px;line-height:1.7}.warn{background:#f2eee4;border-color:var(--gold)}.audioRow{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.audioRow button{border:1px solid var(--line);background:var(--cream);padding:8px 10px}.noData{min-height:440px;display:grid;place-content:center;text-align:center}.noData b{font:42px Georgia,serif}.noData p{color:var(--muted);line-height:1.8}.legacyLink{display:inline-block;margin-top:10px;font-size:11px;color:var(--green)}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line)}header{align-items:flex-start}.brand small{display:none}}@media(max-width:520px){header{padding:9px 13px}.mark{width:34px;height:34px}.brand strong{font-size:14px}nav a{padding:7px 8px}.shell{min-height:calc(100vh - 60px)}main{padding:20px 14px}.levelbar{gap:5px}.levelbar button{padding:8px 10px}.world{min-height:370px}.words button{font-size:37px}.side{padding:22px 18px}}
</style>
</head><body>
<header><a class="brand" href="index.html"><span class="mark">Я</span><span><strong>Russian Structure Lab</strong><small>CANONICAL LEARN · MATERIAL ENGINE</small></span></a><nav><a href="my-material.html">🪆 My Material</a><a href="level-browser.html">📚 Curriculum</a><a href="legacy-index.html">🕰 Legacy Lab</a></nav></header>
<div class="shell"><main><div class="levelbar" id="levels"></div><div class="categorybar" id="categories"></div><div class="status"><span id="scope"></span><span id="counter"></span></div><div class="layers"><button id="lw" class="on" onclick="setLayer('words')"><i>01</i> Words</button><button id="lc" onclick="setLayer('chunks')"><i>02</i> Chunks</button><button id="ls" onclick="setLayer('sentence')"><i>03</i> Sentence</button></div><div id="world" class="world"></div><div class="controls"><button onclick="move(-1)">←</button><span>🎧 聞く · 🧩 気づく · 🪆 開く</span><button onclick="move(1)">→</button></div></main><aside class="side" id="drawer"></aside></div>
<script src="curriculum.js"></script><script src="materials.js"></script><script src="materials-a1-calibration.js"></script><script src="material-engine.js"></script>
<script>
const C=window.RSL_CURRICULUM;const E=window.RSL_MATERIAL_ENGINE;const icons={A1:'🌱',A2:'🌿',B1:'🌳',B2:'🌲',C1:'🏛️',C2:'🌌',UNCLASSIFIED:'🗃️'};let state={level:'A1',category:null,index:0,layer:'words',selected:null,meaning:false};try{const x=JSON.parse(localStorage.getItem('rsl-canonical-state')||'{}');state={...state,...x}}catch{}function save(){localStorage.setItem('rsl-canonical-state',JSON.stringify(state))}function clean(s){return String(s||'').replace(/[.,!?—:;«»“”]/g,'')}function dataset(){return state.level==='UNCLASSIFIED'?E.getByLevel('UNCLASSIFIED'):E.getByCategory(state.level,state.category)}function current(){const d=dataset();if(!d.length)return null;state.index=Math.max(0,Math.min(state.index,d.length-1));return d[state.index]}function displayWords(m){if(m.words&&m.words.length)return m.words.map(w=>({surface:clean(w.surface||''),stressed:w.surface||'',lemma:w.lemma||'',jp:w.jp||''}));return clean(m.ru).split(/\s+/).filter(Boolean).map(x=>({surface:x,stressed:x,lemma:'',jp:''}))}function speech(t,rate=.86){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t==='Я'?'я':t);u.lang='ru-RU';u.rate=rate;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()==='ru-ru')||vs.find(v=>v.lang.toLowerCase().startsWith('ru'))||null;speechSynthesis.speak(u)}
function renderNav(){const stats=E.stats().levels;levels.innerHTML=[...C.levels,'UNCLASSIFIED'].map(l=>`<button class="${state.level===l?'on ':''}${stats[l]===0?'empty':''}" onclick="chooseLevel('${l}')">${icons[l]} ${l==='UNCLASSIFIED'?'Legacy':l} <small>${stats[l]}</small></button>`).join('');categories.innerHTML=state.level==='UNCLASSIFIED'?'<button class="on">旧教材・未分類</button>':`<button class="${!state.category?'on':''}" onclick="chooseCategory(null)">All</button>`+C.categories.map(c=>`<button class="${state.category===c.code?'on':''}" onclick="chooseCategory('${c.code}')">${c.emoji} ${c.name}</button>`).join('')}
function chooseLevel(l){state.level=l;state.category=null;state.index=0;state.selected=null;state.meaning=false;render();save()}function chooseCategory(c){state.category=c;state.index=0;state.selected=null;state.meaning=false;render();save()}function setLayer(x){state.layer=x;state.selected=null;['w','c','s'].forEach(z=>document.getElementById('l'+z).classList.toggle('on',x[0]===z));renderWorld();renderDrawer();save()}function move(n){const d=dataset();if(!d.length)return;state.index=(state.index+n+d.length)%d.length;state.selected=null;state.meaning=false;render();save()}
function render(){renderNav();const d=dataset(),m=current();scope.textContent=state.level==='UNCLASSIFIED'?'🗃️ Legacy · classification pending':`${icons[state.level]} ${state.level}${state.category?' · '+state.category:''}`;counter.textContent=d.length?`${state.index+1} / ${d.length}`:`0 / ${C.perLevel}`;['w','c','s'].forEach(z=>document.getElementById('l'+z).classList.toggle('on',state.layer[0]===z));if(!m){world.innerHTML=`<div class="noData"><b>${icons[state.level]} ${state.level}</b><p>このレベルは選択できます。<br>教材データはまだ 0 / ${C.perLevel} 文です。</p><a class="legacyLink" href="level-browser.html">📚 カリキュラム状態を見る</a></div>`;drawer.innerHTML='<div class="emptySide">📍<br>教材が追加されると<br>ここから深く開けます。</div>';return}renderWorld();renderDrawer()}
function renderWorld(){const m=current();if(!m)return;const ws=displayWords(m);const scene=m.scene?`<button class="scene" onclick="speech(${JSON.stringify(m.ru)})"><small>SCENE</small>${m.scene}</button>`:'';if(state.layer==='words'){world.innerHTML=scene+'<div class="sentenceTitle">Touch the Russian</div><div class="words" lang="ru">'+ws.map((w,i)=>`<button class="${state.selected===i?'on':''}" onclick="selectWord(${i})">${w.stressed||w.surface}</button>`).join('')+'</div><button class="meaning" onclick="state.meaning=!state.meaning;renderWorld()">'+(state.meaning?(m.jp||'日本語説明は未登録'):'意味を見る')+'</button>'}else if(state.layer==='chunks'){const cs=m.chunks&&m.chunks.length?m.chunks:[{ru:m.ru,jp:m.jp}];world.innerHTML=scene+'<div class="sentenceTitle">🧩 Meaning Chunks</div><div class="chunks">'+cs.map(c=>`<button onclick='speech(${JSON.stringify(c.ru||c)})'><strong lang="ru">${c.ru||c}</strong><span>${c.jp||''}</span></button>`).join('')+'</div>'}else{const arch=m.architecture&&m.architecture.length?m.architecture:[];world.innerHTML=scene+`<div class="sentenceTitle">🧱 Whole Sentence</div><button class="whole" onclick='speech(${JSON.stringify(m.ru)})'>${m.ru}</button><div class="architecture">${arch.map((a,i)=>`<div><small>0${i+1}</small><b>${typeof a==='string'?a:(a.label||a.ru||'')}</b></div>`).join('')}</div><div class="audioRow"><button onclick='speech(${JSON.stringify(m.ru)},.9)'>🎧 Natural</button><button onclick='speech(${JSON.stringify(m.ru)},.68)'>🐢 Natural Slow</button><button onclick='speech(${JSON.stringify(m.ru)},.52)'>🔬 Study</button></div>`}}
function selectWord(i){state.selected=i;const w=displayWords(current())[i];speech(w.surface);renderWorld();renderDrawer();save()}function renderDrawer(){const m=current();if(!m)return;if(state.selected===null){drawer.innerHTML=`<div class="emptySide"><div><b>🪆</b><p>単語に触れると、<br>現在の語を保ったまま<br>構造を開きます。</p><small>${m.id} · ${m.verification}</small></div></div>`;return}const w=displayWords(m)[state.selected];drawer.innerHTML=`<div class="focus"><small>📍 CURRENT FOCUS</small><h2 lang="ru">${w.surface}</h2><div class="jp">${w.jp||'意味データは未登録'}</div><div class="row"><small>LEMMA</small><b>${w.lemma||'未解析'}</b></div><div class="row"><small>SOURCE</small><b>${m.source} · ${m.verification}</b></div>${m.caseFocus&&m.caseFocus.length?`<div class="card">📐 Case focus: ${m.caseFocus.join(' · ')}</div>`:''}${m.aspectFocus?`<div class="card">🔄 Aspect: ${m.aspectFocus.impf||'—'} ↔ ${m.aspectFocus.pf||'—'}</div>`:''}${m.anatomyFocus?`<div class="card warn">🧬 Word Anatomy: ${m.anatomyFocus.word||''}<br>${(m.anatomyFocus.parts||[]).join(' + ')}</div>`:''}<div class="audioRow"><button onclick='speech(${JSON.stringify(w.surface)})'>🎧 Word</button><button onclick='speech(${JSON.stringify(m.ru)})'>🎧 Sentence</button></div></div>`}
if(!E||!C){document.body.innerHTML='<p style="padding:30px">Material Engine failed to load.</p>'}else{render()}
</script></body></html>
