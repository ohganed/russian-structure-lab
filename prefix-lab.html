<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prefix Lab</title><style>:root{--i:#18211e;--m:#707773;--p:#f3f0e8;--c:#fbfaf6;--l:#d8d5cc;--g:#285e50;--a:#a98a4e;--f:#fff3c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif}header{padding:12px 4vw;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:10px;align-items:center}a{color:inherit;text-decoration:none}nav{display:flex;gap:7px;flex-wrap:wrap}nav a,button{border:1px solid var(--l);background:var(--c);border-radius:18px;padding:9px 12px;font:inherit}main{width:min(1050px,92vw);margin:auto;padding:28px 0 60px}.hero{text-align:center}.hero h1{font:clamp(42px,7vw,72px)/1 Georgia,serif;margin:12px}.hero p,.muted{color:var(--m);line-height:1.7}.bar{display:flex;gap:8px;overflow-x:auto;margin:24px 0 14px}.bar button{white-space:nowrap;font:20px Georgia,serif}.bar .on{background:var(--i);color:#fff}.box{border:1px solid var(--l);background:var(--c);border-radius:22px;padding:20px;margin-top:14px}.big{font:52px Georgia,serif;color:var(--a)}.warn{border-left:4px solid var(--a);background:#f2eee4;padding:12px;margin-top:12px;font-size:12px}.grid,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.verb{text-align:left;border-radius:16px}.verb.on{outline:3px solid var(--f)}.ru{font:28px Georgia,serif}.card{border:1px solid var(--l);background:white;border-radius:14px;padding:14px}.card small{display:block;color:var(--m);font-size:9px;margin-bottom:5px}.sentence{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:15px;padding-top:15px;border-top:1px solid var(--l)}@media(max-width:760px){header{align-items:flex-start}.grid,.cards{grid-template-columns:1fr}.hero h1{font-size:48px}}</style></head><body><header><a href="index.html"><b>Я Russian Structure Lab</b><br><small>PREFIX LAB</small></a><nav><a href="index.html">← Learn</a><a href="aspect-lab.html">🔄 Aspect</a><a href="word-family-lab.html">🌳 Family</a></nav></header><main><section class="hero"><div>🧭 PREFIX LAB</div><h1>One prefix, different outcomes.</h1><p>同じ接頭語を複数の動詞で比較します。接頭語は「意味の手がかり」であって、意味を機械的に足し算する公式ではありません。</p></section><div class="bar" id="bar"></div><section class="box"><div class="big" id="big"></div><h2 id="title"></h2><div class="muted" id="lead"></div><div class="warn" id="warn"></div></section><div class="grid" id="grid"></div><section class="box"><h2 class="ru" id="word"></h2><button id="sound">🔊 word</button><div class="cards"><div class="card"><small>BASE VERB</small><div id="base"></div></div><div class="card"><small>PREFIX CONTRIBUTION HERE</small><div id="contrib"></div></div><div class="card"><small>WHOLE-WORD MEANING</small><div id="whole"></div></div></div><div class="sentence"><button id="exSound">🎧</button><span class="ru" id="exRu"></span><span class="muted" id="exJp"></span></div></section></main><script>const P=[{p:'пере-',t:'across · again · over',l:'Across a boundary, repetition, transfer, or re-doing.',w:'Do not reduce пере- to “again.”',i:[['переписать','писать','redo / transfer the writing','rewrite / copy again','Я переписал текст.','私は文章を書き直した。'],['перечитать','читать','repeat the reading','reread','Я перечитал письмо.','私は手紙を読み直した。'],['переделать','делать','do over / remake','redo / remake','Надо переделать работу.','その作業をやり直す必要がある。']]},{p:'за-',t:'into · behind · begin · record',l:'Entry, onset, behind/into, or lexicalized recording.',w:'за- is highly polysemous; check the whole verb.',i:[['записать','писать','record/register contribution','write down / record','Запишите адрес.','住所を書き留めてください。'],['зайти','идти','enter / drop by','go in / drop by','Я зайду после работы.','仕事のあと立ち寄ります。'],['заговорить','говорить','onset of speaking','start speaking','Он вдруг заговорил.','彼は突然話し始めた。']]},{p:'про-',t:'through · past · through a span',l:'Traversing a route, text, or duration.',w:'про- can support “through to the end,” but does not itself equal “finish.”',i:[['прочитать','читать','through the text','read through','Я прочитал книгу.','私はその本を読み通した。'],['пройти','идти','movement through / past','pass / go through','Мы прошли парк.','私たちは公園を通り抜けた。'],['прожить','жить','through a span of time','live through','Он прожил там десять лет.','彼はそこで10年間暮らした。']]},{p:'до-',t:'up to · endpoint · finish the rest',l:'Makes an endpoint or remaining portion salient.',w:'Aspect belongs to the whole verb, not до- alone.',i:[['дочитать','читать','reach the reading endpoint','finish reading','Я дочитал книгу.','私は本を最後まで読み終えた。'],['дописать','писать','complete remaining writing','finish writing','Я дописал письмо.','私は手紙を書き終えた。'],['доделать','делать','complete remaining work','finish doing','Надо доделать работу.','仕事を仕上げる必要がある。']]},{p:'вы-',t:'out · outward · extract',l:'Often has an OUT image, spatially or metaphorically.',w:'Many common вы- verbs are lexicalized; learn the whole word too.',i:[['выйти','идти','movement outward','go out / exit','Я вышел из дома.','私は家を出た。'],['выбрать','брать','select out from alternatives','choose','Я выбрал эту книгу.','私はこの本を選んだ。'],['выписать','писать','write out / extract','write out; prescribe','Врач выписал лекарство.','医師が薬を処方した。']]}];let pi=0,wi=0;const q=new URLSearchParams(location.search).get('prefix');if(q){const k=P.findIndex(x=>x.p.replace('-','')===q.replace('-',''));if(k>=0)pi=k}function sp(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.88;speechSynthesis.speak(u)}function r(){const p=P[pi];bar.innerHTML=P.map((x,i)=>`<button class="${i===pi?'on':''}" onclick="pi=${i};wi=0;r()">${x.p}</button>`).join('');big.textContent=p.p;title.textContent=p.t;lead.textContent=p.l;warn.textContent='⚠️ '+p.w;grid.innerHTML=p.i.map((x,i)=>`<button class="verb ${i===wi?'on':''}" onclick="wi=${i};r()"><div class="ru">${x[0]}</div><div class="muted">${x[3]}</div></button>`).join('');const x=p.i[wi];word.textContent=x[0];base.textContent=x[1];contrib.textContent=x[2];whole.textContent=x[3];exRu.textContent=x[4];exJp.textContent=x[5];sound.onclick=()=>sp(x[0]);exSound.onclick=()=>sp(x[4])}r();</script></body></html>
