<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Russian Structure Lab — My Material</title>
<style>
:root{--ink:#18211e;--muted:#737a76;--paper:#f3f0e8;--cream:#fbfaf6;--line:#d8d5cc;--green:#285e50;--red:#a94c3a;--blue:#5d7e92;--gold:#a98a4e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif}button,textarea{font:inherit;color:inherit}.ru{font-family:Georgia,"Times New Roman",serif}header{position:sticky;top:0;z-index:10;height:68px;padding:0 18px;border-bottom:1px solid var(--line);background:#f3f0e8ef;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border:1px solid;border-radius:50%;display:grid;place-items:center;font:21px Georgia,serif}.brand strong{font:17px Georgia,serif}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.16em;text-transform:uppercase}.back{border:1px solid var(--line);background:var(--cream);border-radius:22px;padding:8px 12px;text-decoration:none;color:inherit;font-size:11px}.wrap{max-width:1180px;margin:auto;padding:30px 18px 70px}.hero small{color:var(--green);letter-spacing:.18em;font-size:9px}.hero h1{font:normal clamp(34px,5vw,58px)/1.08 Georgia,serif;margin:10px 0}.hero p{color:var(--muted);max-width:760px;line-height:1.8;font-size:13px}.input{margin-top:28px;display:grid;grid-template-columns:1fr auto;gap:10px}textarea{width:100%;min-height:130px;border:1px solid var(--line);background:var(--cream);padding:20px;font:27px/1.6 Georgia,serif;resize:vertical}.make{border:0;background:var(--ink);color:white;padding:0 22px;border-radius:3px}.material{margin-top:28px;border-top:1px solid var(--line);padding-top:28px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px}.stage{min-height:500px}.modebar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.modebar button{border:1px solid var(--line);background:var(--cream);padding:8px 11px;border-radius:18px;font-size:10px}.modebar button.on{background:var(--ink);color:white}.sentence{font:clamp(30px,4.6vw,56px)/1.5 Georgia,serif}.token{border:0;background:none;padding:3px 2px 7px;margin:0 4px 7px 0;font:inherit;position:relative}.token:hover,.token.on{color:var(--red)}.token.on:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--red)}.hint{color:var(--muted);font-size:10px;margin-top:16px}.chunks{display:flex;gap:10px;flex-wrap:wrap}.chunk{border:1px solid var(--line);background:var(--cream);padding:17px;text-align:left}.chunk strong{display:block;font:25px Georgia,serif}.chunk small{display:block;color:var(--muted);margin-top:7px}.drawer{background:var(--cream);border:1px solid var(--line);min-height:500px;padding:23px}.empty{height:100%;min-height:430px;display:grid;place-content:center;text-align:center;color:var(--muted)}.empty b{font-size:30px}.crumb{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:9px;margin-bottom:17px}.crumb button{border:0;background:none;padding:0;color:var(--green)}.title{font:38px Georgia,serif;margin:0 0 4px}.ipa{font:14px Georgia,serif;color:var(--muted)}.meaning{font-size:18px;margin:15px 0 22px}.node{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-top:1px solid var(--line);background:none;padding:14px 0;text-align:left}.node span:first-child{font-size:11px}.node b{font:18px Georgia,serif}.panel{margin-top:12px;padding:15px;background:#edf0e9;border-left:3px solid var(--green)}.panel.red{background:#f3e9e6;border-color:var(--red)}.panel.gold{background:#f2eee4;border-color:var(--gold)}.parts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.part{border:1px solid var(--line);background:var(--cream);padding:10px 11px}.part small{display:block;color:var(--muted);font-size:8px}.part strong{font:20px Georgia,serif}.family{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.family button{border:0;border-bottom:1px solid #9ca9a2;background:none;font:17px Georgia,serif;padding:3px}.examples button{display:block;border:0;background:none;text-align:left;padding:7px 0;font:16px Georgia,serif}.small{color:var(--muted);font-size:10px;line-height:1.7}.deep{margin-top:14px;border-top:1px solid var(--line)}@media(max-width:850px){.material{grid-template-columns:1fr}.drawer{min-height:360px}.empty{min-height:300px}.input{grid-template-columns:1fr}.make{padding:13px}}@media(max-width:520px){.wrap{padding:22px 13px 50px}.hero h1{font-size:38px}textarea{font-size:23px}.sentence{font-size:36px}.drawer{padding:19px}.brand small{display:none}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark">Я</span><span><strong>Russian Structure Lab</strong><small>My Material · Infinite Matryoshka</small></span></div><a class="back" href="index.html">← Learn</a></header>
<div class="wrap">
<section class="hero"><small>MY MATERIAL</small><h1>自分で選んだ文章を、教材にする。</h1><p>最初から説明を並べません。ロシア語を押すと音が鳴る。もう一度押すと意味。さらに気になれば、Word Anatomy・Aspect・Case・Word Family・例文へ。必要な深さまで自分で潜れます。</p></section>
<div class="input"><textarea id="source" lang="ru">Президент подписал новый закон.</textarea><button class="make" onclick="materialize()">教材化する</button></div>
<section class="material">
  <div class="stage"><div class="modebar"><button id="mWords" class="on" onclick="setMode('words')">🔤 Words</button><button id="mChunks" onclick="setMode('chunks')">🧩 Chunks</button><button id="mSentence" onclick="setMode('sentence')">🏗️ Sentence</button></div><div id="stage"></div></div>
  <aside class="drawer" id="drawer"></aside>
</section>
</div>
<script>
const DB={
'Президент':{stress:'Президе́нт',ipa:'/prʲɪzʲɪˈdʲent/',lemma:'президент',jp:'大統領',en:'president',pos:'noun',form:'masculine · singular · nominative',role:'主語 / subject'},
'подписал':{stress:'подписа́л',ipa:'/pɐtpʲɪˈsal/',lemma:'подписать',jp:'署名した',en:'signed',pos:'verb',form:'past · masculine · singular',role:'述語 / predicate',aspect:{impf:'подписывать',pf:'подписать',note:'この文では、署名という出来事を一つの境界ある出来事として見ています。'},anatomy:[['под-','prefix','動詞に方向・完成・付加などの語彙的意味を加える接頭辞。ここでは подписать という語全体の形成に関わる。'],['-пис-','root','「書く」に関係する中心部分。'],['-а-','suffix','動詞語幹形成に関わる要素。'],['-ть','infinitive marker','不定詞を示す要素。']],family:['писать','написать','записать','переписать','подписать','подписывать','писатель','запись'],examples:['Он подписал договор.','Она подписывает документы каждый день.','Президент подписал закон вчера.']},
'новый':{stress:'но́вый',ipa:'/ˈnovɨj/',lemma:'новый',jp:'新しい',en:'new',pos:'adjective',form:'masculine · singular · accusative',role:'закон と一致 / agrees with закон'},
'закон':{stress:'зако́н',ipa:'/zɐˈkon/',lemma:'закон',jp:'法律',en:'law',pos:'noun',form:'masculine · singular · accusative',role:'目的語 / object',caseInfo:{name:'Accusative / 対格',why:'подписать（署名する）の対象として、この文では「何に署名したか」を示しています。',examples:['подписать договор','читать закон','обсуждать проект']}}
};
let tokens=[],selected=null,clickDepth={},mode='words';
let voices=[];function refresh(){voices=speechSynthesis.getVoices()}if('speechSynthesis'in window){refresh();speechSynthesis.onvoiceschanged=refresh}
function voice(){refresh();return voices.find(v=>v.lang.toLowerCase()==='ru-ru')||voices.find(v=>v.lang.toLowerCase().startsWith('ru'))||null}
function speak(text,rate=.86){if(!('speechSynthesis'in window))return;let t=text.trim();if(t==='Я')t='я';speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=rate;const v=voice();if(v)u.voice=v;speechSynthesis.speak(u)}
function cleanToken(x){return x.replace(/[«»“”„.,!?;:()—]/g,'')}
function materialize(){tokens=document.getElementById('source').value.trim().split(/\s+/).filter(Boolean);selected=null;clickDepth={};setMode('words');renderDrawer()}
function setMode(m){mode=m;['Words','Chunks','Sentence'].forEach(x=>document.getElementById('m'+x).classList.toggle('on',m===x.toLowerCase()));renderStage()}
function wordClick(i){const key=cleanToken(tokens[i]);if(selected===i){clickDepth[i]=(clickDepth[i]||1)+1}else{selected=i;clickDepth[i]=1}speak(key);renderStage();renderDrawer()}
function renderStage(){const text=tokens.join(' ');if(mode==='words'){stage.innerHTML='<div class="sentence ru">'+tokens.map((t,i)=>`<button class="token ${selected===i?'on':''}" onclick="wordClick(${i})">${t}</button>`).join(' ')+'</div><div class="hint">1回：音　→　もう一度：意味　→　さらに：構造へ</div>'}else if(mode==='chunks'){const chunks=makeChunks();stage.innerHTML='<div class="chunks">'+chunks.map(c=>`<button class="chunk" onclick="speak('${c.ru.replace(/'/g,"\\'")}')"><strong class="ru">${c.ru}</strong><small>${c.jp}</small></button>`).join('')+'</div><div class="hint">チャンクそのものも押せます。押すと自然なまとまりとして読みます。</div>'}else{stage.innerHTML=`<button class="sentence token ru" onclick="speak('${text.replace(/'/g,"\\'")}')">${text}</button><div class="panel"><b>Sentence Architecture</b><p class="small">Президент → подписал → новый закон<br>WHO → ACTION → OBJECT</p></div>`}}
function makeChunks(){const s=tokens.map(cleanToken);if(s.join(' ')==='Президент подписал новый закон')return[{ru:'Президент',jp:'大統領が'},{ru:'подписал',jp:'署名した'},{ru:'новый закон',jp:'新しい法律に'}];return s.map(x=>({ru:x,jp:(DB[x]&&DB[x].jp)||'意味を開く'}))}
function renderDrawer(){if(selected===null){drawer.innerHTML='<div class="empty"><b>🪆</b><p>気になるロシア語を押してください。<br>必要な深さだけ開きます。</p></div>';return}const surface=cleanToken(tokens[selected]),d=DB[surface]||{stress:surface,ipa:'',lemma:surface,jp:'解析データ未登録',en:'',pos:'',form:'',role:'この試作版では未知語は音声入口として扱います。'};const depth=clickDepth[selected]||1;let html=`<div class="crumb"><button onclick="selected=null;renderStage();renderDrawer()">Original</button><span>›</span><b>${surface}</b></div><h2 class="title ru">${d.stress||surface}</h2>${d.ipa?`<div class="ipa">${d.ipa}</div>`:''}`;
if(depth>=2)html+=`<div class="meaning">${d.jp}${d.en?' · '+d.en:''}</div><button class="node" onclick="openDepth()"><span>Dictionary form</span><b class="ru">${d.lemma||surface} →</b></button><button class="node" onclick="openDepth()"><span>Form</span><b>${d.form||'—'} →</b></button><button class="node" onclick="openDepth()"><span>In this sentence</span><b>${d.role||'—'} →</b></button>`;
if(depth>=3&&d.aspect)html+=`<div class="panel red"><b>🔄 Aspect</b><div class="family"><button onclick="speak('${d.aspect.impf}')">${d.aspect.impf}</button><span>↔</span><button onclick="speak('${d.aspect.pf}')">${d.aspect.pf}</button></div><p class="small">${d.aspect.note}</p><button class="node deep" onclick="openDepth()"><span>Aspectをさらに開く</span><b>→</b></button></div>`;
if(depth>=3&&d.caseInfo)html+=`<div class="panel"><b>📐 ${d.caseInfo.name}</b><p class="small">${d.caseInfo.why}</p><button class="node deep" onclick="openDepth()"><span>この格をさらに開く</span><b>→</b></button></div>`;
if(depth>=4&&d.anatomy)html+=`<div class="panel gold"><b>🧬 Word Anatomy</b><div class="parts">${d.anatomy.map((p,i)=>`<button class="part" onclick="showPart(${i})"><small>${p[1]}</small><strong class="ru">${p[0]}</strong></button>`).join('')}</div><div id="partInfo" class="small" style="margin-top:10px">長い語を一塊として見ず、意味のある部品として見ます。</div></div>`;
if(depth>=5&&d.family)html+=`<div class="panel"><b>🌳 Word Family</b><div class="family">${d.family.map(x=>`<button onclick="speak('${x}')">${x}</button>`).join('')}</div><p class="small">同じ語根を持つ語を、別々の暗記項目ではなくネットワークとして見ます。</p></div>`;
if(depth>=6&&d.examples)html+=`<div class="panel"><b>📖 More encounters</b><div class="examples">${d.examples.map(x=>`<button onclick="speak('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}</div></div>`;
if(depth>=3&&!d.aspect&&!d.caseInfo)html+=`<div class="panel"><b>🧬 Structure</b><p class="small">${d.pos||'word'} · ${d.form||''}<br>${d.role||''}</p></div>`;
if(depth<6)html+=`<button class="node deep" onclick="openDepth()"><span>さらに知る</span><b>🪆 →</b></button>`;drawer.innerHTML=html}
function openDepth(){if(selected===null)return;clickDepth[selected]=(clickDepth[selected]||1)+1;renderDrawer()}
function showPart(i){const d=DB[cleanToken(tokens[selected])];if(!d||!d.anatomy)return;document.getElementById('partInfo').innerHTML='<b class="ru">'+d.anatomy[i][0]+'</b> — '+d.anatomy[i][2]}
materialize();
</script>
</body></html>
