<header><div class="brand"><span class="mark">Я</span><span><strong>Russian Structure Lab</strong><small>MY MATERIAL · NETWORK READER</small></span></div><a class="back" href="index.html">← Learn</a></header><main class="app"><section class="info"><div class="infoTop"><div><h1>📊 Information Corner</h1><div class="small">Russian Structure Lab：聞く → 気づく → 分解する → 関係を見る → 使う。</div></div><div class="focusChip"><small>📍 CURRENT FOCUS</small><strong id="topFocus" class="ru">—</strong><span id="topMeta" class="small">語を押してください</span></div></div><div class="controls"><button id="localBtn" class="on" onclick="setPolicy('local')">Local Only</button><button id="askBtn" onclick="setPolicy('ask')">Ask When Needed</button><button id="aiBtn" onclick="setPolicy('ai')">AI Assisted</button><button onclick="speak(source.value,.9)">🎧 Natural</button><button onclick="speak(source.value,.68)">🐢 Natural Slow</button><button onclick="speak(source.value,.52)">🔬 Study</button></div><div class="inputRow"><textarea id="source" lang="ru">Вчера вечером я встретился со старым другом, которого давно не видел.</textarea><button class="make" onclick="materialize()">教材化</button></div></section><section class="lower"><section class="textPane mobileOn" id="textPane"><div class="paneLabel">🇷🇺 RUSSIAN TEXT</div><div id="stage"></div><div class="hint">1回：音 🎧　2回：意味＋元の語＋分解表示 🧬　さらに：Case / Aspect / Network 🪆</div></section><aside class="divePane" id="divePane"><div id="drawer"></div></aside></section><nav class="mobileNav"><button id="navText" class="on" onclick="mobilePane('text')">🇷🇺 Text</button><button id="navDive" onclick="mobilePane('dive')">🪆 Dive</button></nav></main><script>

'которого':{lemma:'который',jp:'〜するところの／その人を',pos:'relative pronoun',form:'masculine singular genitive/accusative',case:'Genitive / 生格',gender:'masculine',declension:['который','которого','которому','которого','которым','котором'],anatomy:[['котор','語幹'],['ого','生格/対格語尾']]},
'давно':{lemma:'давно',jp:'長い間',pos:'adverb',anatomy:[['давн','語幹'],['о','副詞形成']]},'не':{lemma:'не',jp:'〜ない',pos:'particle',anatomy:[['не','否定辞']]},
'видел':{lemma:'видеть',jp:'見た・会った',pos:'verb',form:'past masculine singular',aspect:{impf:'видеть',pf:'увидеть'},anatomy:[['вид','語根/語幹'],['е','接尾要素'],['л','過去形標識']],family:['видеть','увидеть','вид','видимый'],collocations:['видеть друга','видеть город'],contrasts:['видеть ↔ смотреть'],examples:['Я давно его не видел.','Я вижу город.']},

'со':{lemma:'с',jp:'〜と',pos:'preposition',governs:'Instrumental / 造格',anatomy:[['со','前置詞']]},

'подписал':{lemma:'подписать',jp:'署名した',pos:'verb',form:'past masculine singular',aspect:{impf:'подписывать',pf:'подписать'},anatomy:[['под','接頭辞'],['пис','語根'],['а','接尾要素'],['л','過去形標識']],family:['писать','написать','записать','переписать','подписать','подписывать'],collocations:['подписать закон','подписать договор'],contrasts:['подписать ↔ подписывать'],situations:['✍️ 署名する','📄 文書を承認する'],examples:['Президент подписал закон.','Он подписал договор.']},
'новый':{lemma:'новый',jp:'新しい',pos:'adjective',form:'masculine singular accusative',case:'Accusative / 対格',gender:'masculine',declension:['новый','нового','новому','новый','новым','новом'],anatomy:[['нов','語幹'],['ый','形容詞語尾']]},
'закон':{lemma:'закон',jp:'法律',pos:'noun',case:'Accusative / 対格',gender:'masculine',declension:['закон','закона','закону','закон','законом','законе'],anatomy:[['закон','語幹']]},
'книга':{lemma:'книга',jp:'本',pos:'noun',case:'Nominative / 主格',gender:'feminine',declension:['книга','книги','книге','книгу','книгой','книге'],anatomy:[['книг','語幹'],['а','女性名詞語尾']]},
'сестре':{lemma:'сестра',jp:'姉・妹に',pos:'noun',form:'feminine singular dative',case:'Dative / 与格',gender:'feminine',declension:['сестра','сестры','сестре','сестру','сестрой','сестре'],anatomy:[['сестр','語幹'],['е','与格語尾']]},
'море':{lemma:'море',jp:'海',pos:'noun',case:'Nominative / 主格',gender:'neuter',declension:['море','моря','морю','море','морем','море'],anatomy:[['мор','語幹'],['е','中性名詞語尾']]},
'друзьями':{lemma:'друзья',jp:'友人たちと',pos:'noun',form:'plural instrumental',case:'Instrumental / 造格',gender:'plural',declension:['друзья','друзей','друзьям','друзей','друзьями','друзьях'],anatomy:[['друзь','語幹'],['ями','複数・造格語尾']]}
};
const CASES=[['Nominative','主格'],['Genitive','生格'],['Dative','与格'],['Accusative','対格'],['Instrumental','造格'],['Prepositional','前置格']];const PREFIXES=['пере','пред','под','над','без','раз','рас','про','при','вы','вз','воз','за','на','по','от','об','в','с','у'];const AIKEY='rsl-ai-cache-v1';let aiCache=JSON.parse(localStorage.getItem(AIKEY)||'{}'),tokens=[],selected=-1,taps={},policy='local',voices=[];function refresh(){voices=speechSynthesis.getVoices()}if('speechSynthesis'in window){refresh();speechSynthesis.onvoiceschanged=refresh}function rv(){refresh();return voices.find(v=>v.lang.toLowerCase().startsWith('ru'))||null}function speak(t,r=.82){if(!('speechSynthesis'in window))return;t=(t||'').trim();if(t==='Я')t='я';speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=r;const v=rv();if(v)u.voice=v;speechSynthesis.speak(u)}function norm(x){return x.toLowerCase().replace(/[«»“”„.,!?;:()—]/g,'')}function setPolicy(p){policy=p;['local','ask','ai'].forEach(x=>document.getElementById(x+'Btn').classList.toggle('on',x===p));if(selected>=0)renderDrawer()}
function heuristicAnatomy(k){const parts=[];let rest=k;const p=PREFIXES.find(x=>rest.startsWith(x)&&rest.length>x.length+4);if(p){parts.push([p,'接頭辞?']);rest=rest.slice(p.length)}const endings=[['иями','複数語尾?'],['ями','複数語尾?'],['ами','複数語尾?'],['ого','格語尾?'],['ему','格語尾?'],['ому','格語尾?'],['лась','過去形＋再帰?'],['лись','過去形＋再帰?'],['лся','過去形＋再帰?'],['ом','格語尾?'],['ем','格語尾?'],['ой','格語尾?'],['ей','格語尾?'],['ым','格語尾?'],['им','格語尾?']];const e=endings.find(x=>rest.endsWith(x[0])&&rest.length>x[0].length+2);if(e){const stem=rest.slice(0,-e[0].length);if(stem)parts.push([stem,'語幹?']);parts.push([e[0],e[1]])}else if(rest.length>5&&rest.endsWith('ся')){parts.push([rest.slice(0,-2),'語幹/活用形?']);parts.push(['ся','再帰接尾辞'])}else parts.push([rest,p?'残りの語幹?':'語全体']);return parts}
function guess(k){let d={lemma:k,jp:'意味は未登録',pos:'unknown',confidence:.35,source:'local heuristic',anatomy:heuristicAnatomy(k),anatomyEstimated:true};if(/(лся|лась|лись|лось)$/.test(k)){d.pos='verb?';d.form='past reflexive form?';d.confidence=.58}else if(/(л|ла|ли|ло)$/.test(k)){d.pos='verb?';d.form='past form?';d.confidence=.52}else if(/(ом|ем|ой|ей|ами|ями)$/.test(k)){d.pos='noun/adjective?';d.case='Instrumental?';d.confidence=.45}return d}function localGuess(w){const k=norm(w);let d=LEX[k]?{...LEX[k],confidence:.95,source:'local DB'}:guess(k);if(aiCache[k])d={...d,...aiCache[k],source:(d.source||'local')+' + AI cache',confidence:Math.max(d.confidence||0,aiCache[k].confidence||.9)};if(!d.anatomy)d.anatomy=heuristicAnatomy(k);return d}
function materialize(){tokens=source.value.trim().split(/\s+/).filter(Boolean);selected=-1;taps={};render();drawer.innerHTML='<div class="empty">🪆<br><br>左のロシア語から<br>気になる語を押してください。</div>';topFocus.textContent='—';topMeta.textContent='語を押してください';mobilePane('text')}function clickWord(i){selected=i;taps[i]=(taps[i]||0)+1;const s=norm(tokens[i]),d=localGuess(s);speak(s);topFocus.textContent=s;topMeta.textContent=(d.lemma&&d.lemma!==s?'→ '+d.lemma+' · ':'')+(d.pos||'');render();renderDrawer();if(innerWidth<=720&&taps[i]>=2)mobilePane('dive')}function render(){stage.innerHTML='<div class="sentence ru">'+tokens.map((t,i)=>{const d=localGuess(t);return `<button class="token ${selected===i?'on':''} ${d.confidence<.65?'low':''}" onclick="clickWord(${i})">${t}</button>`}).join(' ')+'</div>'}
function anatomyHTML(d,s){const a=(d.anatomy&&d.anatomy.length)?d.anatomy:[[s,'語全体']];return `<div class="wordBuild"><div class="wordOriginal"><span>ORIGINAL SPELLING</span><strong class="ru">${s}</strong></div><div class="morphLine">${a.map((p,i)=>`${i?'<span class="join">＋</span>':''}<button class="morph" onclick="speak('${p[0]}')"><strong class="ru">${p[0]}</strong><small>${p[1]}</small></button>`).join('')}</div><div class="buildNote">🧬 元の綴りは必ず残し、その下で構造を分解します。${d.anatomyEstimated?' この分解はローカル推定なので「?」付きです。':''}</div></div>`}
function aspectHTML(d){if(!d.aspect)return'';const lemma=d.lemma||'';return `<div class="panel red"><b>🔄 Aspect</b><div class="aspectPair"><button class="aspectWord ${lemma===d.aspect.impf?'currentSide':''}" onclick="speak('${d.aspect.impf}')">${d.aspect.impf}</button><span>↔</span><button class="aspectWord ${lemma===d.aspect.pf?'currentSide':''}" onclick="speak('${d.aspect.pf}')">${d.aspect.pf}</button></div></div>`}function normalizedCaseName(d){const c=(d.case||'').toLowerCase();if(c.includes('nominative'))return'Nominative';if(c.includes('genitive'))return'Genitive';if(c.includes('dative'))return'Dative';if(c.includes('accusative'))return'Accusative';if(c.includes('instrumental'))return'Instrumental';if(c.includes('prepositional'))return'Prepositional';return''}function caseHTML(d,s){if(!d.case&&!d.declension)return'';const current=normalizedCaseName(d);let forms=Array.isArray(d.declension)?d.declension.slice(0,6):Array(6).fill('');while(forms.length<6)forms.push('');if(!d.declension&&current){const idx=CASES.findIndex(c=>c[0]===current);if(idx>=0)forms[idx]=s}const type=d.gender==='feminine'?'女性形':d.gender==='neuter'?'中性形':d.gender==='plural'?'複数形':d.gender==='masculine'?'男性形':'格変化';return `<div class="panel"><b>📐 Case · ${type}</b><div class="caseGrid">${CASES.map((c,i)=>{const form=forms[i]||'未解析';const missing=!forms[i];return `<button class="caseRow ${current===c[0]?'currentCase':''} ${missing?'missing':''}" ${missing?'':'onclick="speak(\''+forms[i]+'\')"'}><small>${c[0]}<br>${c[1]}</small><strong class="ru">${form}</strong><em>${current===c[0]?'📍':''}</em></button>`}).join('')}</div><div class="caseLegend">6格は常に全部表示し、現在の格だけ 📍 で強調します。</div></div>`}
function networkData(type,d,s){if(type==='meaning')return{title:'🧠 Meaning',body:`<p><b class="ru">${d.lemma||s}</b> — ${d.jp||'意味未登録'}</p>`};if(type==='contrast')return{title:'⚖️ Contrast',body:(d.contrasts||['比較データはまだ未登録']).map(x=>`<button onclick="speak('${x.split('↔')[0].trim()}')">${x}</button>`).join(' ')};if(type==='collocation')return{title:'🧩 Collocation',body:(d.collocations||['コロケーションはまだ未登録']).map(x=>`<button onclick="speak('${x}')">${x}</button>`).join(' ')};if(type==='situation')return{title:'🎭 Situation',body:(d.situations||['🎭 使用場面データはまだ未登録']).map(x=>`<div>${x}</div>`).join('')};if(type==='examples')return{title:'📖 Examples',body:(d.examples||['例文はまだ未登録']).map(x=>`<button onclick="speak('${x}')">${x}</button>`).join('<br>')};if(type==='encounters')return{title:'🗺️ Encounters',body:'<p class="small">遭遇記録は今後ここに蓄積します。</p>'}}function openNetwork(type){const s=norm(tokens[selected]),d=localGuess(s),x=networkData(type,d,s),box=document.getElementById('networkResult');box.innerHTML=`<h4>${x.title}</h4>${x.body}`;box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderDrawer(){if(selected<0)return;const s=norm(tokens[selected]),d=localGuess(s),depth=taps[selected]||1;let h=`<div class="current"><small>📍 CURRENT ORIGIN</small><strong class="ru">${s}</strong><span class="small">${d.lemma&&d.lemma!==s?'lemma → '+d.lemma:''}</span></div><div class="small">${Math.round((d.confidence||0)*100)}% · ${d.source||'local'} ${d.confidence<.65?'<span class="badge">要確認</span>':''}</div>`;if(depth>=2){h+=`<div class="meaning">${d.jp||'意味未登録'}</div>`;h+=anatomyHTML(d,s);h+=`<div class="row"><small>Dictionary form</small><b class="ru">${d.lemma||s}</b></div><div class="row"><small>Part of speech</small><b>${d.pos||'—'}</b></div>${d.form?`<div class="row"><small>Form</small><b>${d.form}</b></div>`:''}${d.case?`<div class="row"><small>📐 Case</small><b>${d.case}</b></div>`:''}${d.governs?`<div class="row"><small>Government</small><b>${d.governs}</b></div>`:''}${d.why?`<div class="panel"><b>📐 Why?</b><p class="small">${d.why}</p></div>`:''}`;if(d.case||d.declension)h+=caseHTML(d,s)}if(depth>=3)h+=aspectHTML(d);if(depth>=4&&d.family)h+=`<div class="panel"><b>🌳 Word Family</b><div class="family">${d.family.map(x=>`<button onclick="speak('${x}')">${x}</button>`).join('')}</div></div>`;if(depth>=3)h+=`<div class="panel"><b>🪆 Network branches</b><div class="branch"><button onclick="openNetwork('meaning')">🧠 Meaning</button><button onclick="openNetwork('contrast')">⚖️ Contrast</button><button onclick="openNetwork('collocation')">🧩 Collocation</button><button onclick="openNetwork('situation')">🎭 Situation</button><button onclick="openNetwork('examples')">📖 Examples</button><button onclick="openNetwork('encounters')">🗺️ Encounters</button></div><div id="networkResult" class="networkResult"><span class="small">分岐を選ぶと、ここにその世界が開きます。</span></div></div>`;if(d.confidence<.65&&policy!=='local')h+=`<div class="panel gold"><b>✨ AIが役立ちそうです</b><p class="small">ローカル解析の確信度が低い箇所です。</p></div>`;h+=`<button class="deep" onclick="taps[selected]++;renderDrawer()">さらに深く見る →</button>`;if(depth>=2)h+=`<div class="aiBox"><b>✨ AI refinement（任意）</b><textarea id="aiJson" placeholder='{"words":{"${s}":{"anatomy":[["…","接頭辞"],["…","語根"]]}}}'></textarea><button onclick="importAI()">AI解析を追加</button><div id="aiStatus" class="small"></div></div>`;drawer.innerHTML=h}
function importAI(){try{const obj=JSON.parse(aiJson.value),words=obj.words||obj;for(const[k,v]of Object.entries(words))aiCache[norm(k)]={...(aiCache[norm(k)]||{}),...v,confidence:v.confidence||.9};localStorage.setItem(AIKEY,JSON.stringify(aiCache));aiStatus.textContent='✓ 保存しました';render();renderDrawer()}catch(e){aiStatus.textContent='JSONを確認してください'}}function mobilePane(p){textPane.classList.toggle('mobileOn',p==='text');divePane.classList.toggle('mobileOn',p==='dive');navText.classList.toggle('on',p==='text');navDive.classList.toggle('on',p==='dive')}materialize();</script></body></html>
