<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Russian Structure Lab — My Material</title><style>
:root{--ink:#18211e;--muted:#737a76;--paper:#f3f0e8;--cream:#fbfaf6;--line:#d8d5cc;--green:#285e50;--red:#a94c3a;--gold:#a98a4e;--focus:#fff3c9}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif}button,textarea{font:inherit;color:inherit}.ru{font-family:Georgia,"Times New Roman",serif}header{height:58px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#f3f0e8f5}.brand{display:flex;gap:9px;align-items:center}.mark{width:34px;height:34px;border:1px solid;border-radius:50%;display:grid;place-items:center;font:20px Georgia}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.14em}.back{border:1px solid var(--line);background:var(--cream);border-radius:20px;padding:7px 11px;text-decoration:none;color:inherit;font-size:10px}.app{height:calc(100vh - 58px);display:grid;grid-template-rows:minmax(170px,31vh) 1fr;overflow:hidden}.info{overflow:auto;border-bottom:1px solid var(--line);padding:16px 20px;background:var(--paper)}.infoTop{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.info h1{font:normal 25px Georgia;margin:0 0 5px}.small{color:var(--muted);font-size:10px;line-height:1.6}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.controls button{border:1px solid var(--line);background:var(--cream);border-radius:18px;padding:7px 10px;font-size:10px}.controls button.on{background:var(--ink);color:white}.inputRow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:11px}textarea{width:100%;min-height:66px;max-height:125px;border:1px solid var(--line);background:var(--cream);padding:11px 13px;font:18px/1.45 Georgia;resize:vertical}.make{border:0;background:var(--ink);color:white;padding:0 18px}.focusChip{min-width:190px;border:1px solid var(--line);background:var(--cream);padding:10px 13px}.focusChip small{display:block;color:var(--muted);font-size:8px}.focusChip strong{display:block;font:22px Georgia;margin-top:3px}.lower{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(330px,.8fr);min-height:0}.textPane,.divePane{min-height:0;overflow:auto;padding:24px}.textPane{border-right:1px solid var(--line)}.paneLabel{position:sticky;top:-24px;z-index:2;background:linear-gradient(var(--paper) 75%,transparent);padding:14px 0 15px;color:var(--muted);font-size:9px;letter-spacing:.12em}.sentence{font:clamp(31px,4vw,55px)/1.65 Georgia}.token{border:0;background:none;padding:2px 2px 7px;margin:0 4px 8px 0;font:inherit;position:relative;border-radius:4px}.token.on{background:var(--focus);box-shadow:0 0 0 2px var(--focus)}.token.low:after{content:'·';position:absolute;top:-10px;left:50%;color:var(--gold);font-size:14px}.hint{margin-top:20px;color:var(--muted);font-size:10px}.divePane{background:var(--cream)}.empty{min-height:65%;display:grid;place-content:center;text-align:center;color:var(--muted)}.current{position:sticky;top:-24px;z-index:4;margin:-24px -24px 18px;padding:16px 24px 12px;background:#fbfaf6f2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.current small{font-size:8px;color:var(--muted);letter-spacing:.12em}.current strong{display:block;font:29px Georgia;margin-top:3px}.meaning{font-size:18px;margin:12px 0 18px}.row{border-top:1px solid var(--line);padding:11px 0}.row small{display:block;color:var(--muted);font-size:8px}.row b{font-size:13px}.panel{margin-top:13px;padding:14px;background:#edf0e9;border-left:3px solid var(--green)}.panel.gold{background:#f2eee4;border-color:var(--gold)}.panel.red{background:#f3e9e6;border-color:var(--red)}.parts,.family,.branch{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.part,.family button,.branch button{border:1px solid var(--line);background:var(--cream);padding:8px 10px}.part small{display:block;font-size:8px;color:var(--muted)}.family button{border-width:0 0 1px;font:17px Georgia}.aspectPair{display:flex;align-items:center;gap:9px;margin-top:10px}.aspectWord{border:1px solid var(--line);background:var(--cream);padding:8px 10px;font:18px Georgia}.aspectWord.currentSide{background:var(--focus);border-color:#d6bd6b;font-weight:700;position:relative}.aspectWord.currentSide:after{content:'📍';font-size:10px;margin-left:5px}.deep{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:12px 0;margin-top:8px}.mobileNav{display:none}.aiBox{margin-top:18px;padding:12px;border:1px dashed var(--line)}.aiBox textarea{min-height:80px;font:11px/1.4 ui-monospace,monospace}.badge{display:inline-block;padding:3px 6px;border-radius:10px;background:#ece9df;font-size:8px;margin-left:5px}@media(max-width:720px){header{height:52px}.app{height:calc(100vh - 52px);grid-template-rows:auto 1fr 48px}.info{max-height:31vh;padding:11px 13px}.info h1{font-size:18px}.infoTop{gap:8px}.focusChip{min-width:115px;padding:7px}.focusChip strong{font-size:17px}.inputRow textarea{font-size:15px;min-height:52px}.lower{display:block;position:relative}.textPane,.divePane{position:absolute;inset:0;border:0;padding:18px;display:none}.textPane.mobileOn,.divePane.mobileOn{display:block}.sentence{font-size:34px}.mobileNav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--cream)}.mobileNav button{border:0;background:none}.mobileNav button.on{font-weight:700;background:#efede5}.current{top:-18px;margin:-18px -18px 14px;padding:13px 18px}.paneLabel{top:-18px}.brand small{display:none}}
</style></head><body><header><div class="brand"><span class="mark">Я</span><span><strong>Russian Structure Lab</strong><small>MY MATERIAL · NETWORK READER</small></span></div><a class="back" href="index.html">← Learn</a></header><main class="app"><section class="info"><div class="infoTop"><div><h1>📊 Information Corner</h1><div class="small">教材全体の状態と音声・解析方針。詳細は右のDeep Diveへ。</div></div><div class="focusChip"><small>📍 CURRENT FOCUS</small><strong id="topFocus" class="ru">—</strong><span id="topMeta" class="small">語を押してください</span></div></div><div class="controls"><button id="localBtn" class="on" onclick="setPolicy('local')">Local Only</button><button id="askBtn" onclick="setPolicy('ask')">Ask When Needed</button><button id="aiBtn" onclick="setPolicy('ai')">AI Assisted</button><button onclick="speak(source.value,.9)">🎧 Natural</button><button onclick="speak(source.value,.68)">🐢 Natural Slow</button><button onclick="speak(source.value,.52)">🔬 Study</button></div><div class="inputRow"><textarea id="source" lang="ru">Вчера вечером я встретился со старым другом, которого давно не видел.</textarea><button class="make" onclick="materialize()">教材化</button></div></section><section class="lower"><section class="textPane mobileOn" id="textPane"><div class="paneLabel">🇷🇺 RUSSIAN TEXT</div><div id="stage"></div><div class="hint">語を押す＝音 🎧　もう一度＝意味　さらに＝ネットワークを深掘り 🪆</div></section><aside class="divePane" id="divePane"><div id="drawer"></div></aside></section><nav class="mobileNav"><button id="navText" class="on" onclick="mobilePane('text')">🇷🇺 Text</button><button id="navDive" onclick="mobilePane('dive')">🪆 Dive</button></nav></main><script>
const LEX={'я':{lemma:'я',jp:'私',pos:'pronoun',form:'nominative',case:'Nominative / 主格'},'вчера':{lemma:'вчера',jp:'昨日',pos:'adverb'},'вечером':{lemma:'вечер',jp:'夕方に',pos:'noun/adverbial',form:'instrumental singular',case:'Instrumental / 造格'},'старым':{lemma:'старый',jp:'古い・昔からの',pos:'adjective',form:'masculine singular instrumental',case:'Instrumental / 造格'},'другом':{lemma:'друг',jp:'友人と',pos:'noun',form:'masculine singular instrumental',case:'Instrumental / 造格',why:'前置詞 с/со と結びつき「〜と一緒に」の関係を作ります。'},'которого':{lemma:'который',jp:'〜するところの／その人を',pos:'relative pronoun'},'давно':{lemma:'давно',jp:'長い間',pos:'adverb'},'не':{lemma:'не',jp:'〜ない',pos:'particle'},'видел':{lemma:'видеть',jp:'見た・会った',pos:'verb',form:'past masculine singular',aspect:{impf:'видеть',pf:'увидеть'},anatomy:[['вид','root'],['е','suffix'],['ть','infinitive']],family:['видеть','увидеть','вид','видимый']},'встретился':{lemma:'встретиться',jp:'会った',pos:'verb',form:'past masculine singular',aspect:{impf:'встречаться',pf:'встретиться'},anatomy:[['встрет','root/stem zone'],['и','suffix'],['ть','infinitive'],['ся','reflexive postfix']],family:['встреча','встречать','встречаться','встретить','встретиться']},'со':{lemma:'с',jp:'〜と',pos:'preposition',governs:'Instrumental / 造格'},'президент':{lemma:'президент',jp:'大統領',pos:'noun'},'подписал':{lemma:'подписать',jp:'署名した',pos:'verb',form:'past masculine singular',aspect:{impf:'подписывать',pf:'подписать'},anatomy:[['под','prefix'],['пис','root'],['а','suffix'],['ть','infinitive']],family:['писать','написать','записать','переписать','подписать','подписывать']},'новый':{lemma:'новый',jp:'新しい',pos:'adjective'},'закон':{lemma:'закон',jp:'法律',pos:'noun'}};
const PREFIXES=['пере','пред','под','над','без','раз','рас','про','при','вы','вз','воз','за','на','по','от','об','в','с','у'];const AIKEY='rsl-ai-cache-v1';let aiCache=JSON.parse(localStorage.getItem(AIKEY)||'{}'),tokens=[],selected=-1,taps={},policy='local',voices=[];function refresh(){voices=speechSynthesis.getVoices()}if('speechSynthesis'in window){refresh();speechSynthesis.onvoiceschanged=refresh}function ruVoice(){refresh();return voices.find(v=>v.lang.toLowerCase().startsWith('ru'))||null}function speak(t,rate=.82){if(!('speechSynthesis'in window))return;t=(t||'').trim();if(t==='Я')t='я';speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=rate;const v=ruVoice();if(v)u.voice=v;speechSynthesis.speak(u)}function norm(x){return x.toLowerCase().replace(/[«»“”„.,!?;:()—]/g,'')}function setPolicy(p){policy=p;['local','ask','ai'].forEach(x=>document.getElementById(x+'Btn').classList.toggle('on',x===p));if(selected>=0)renderDrawer()}function guessBase(k){let d={lemma:k,jp:'意味は未登録',pos:'unknown',confidence:.35,source:'local heuristic'};if(/(лся|лась|лись|лось)$/.test(k)){d.pos='verb?';d.form='past reflexive form?';d.confidence=.58}else if(/(л|ла|ли|ло)$/.test(k)){d.pos='verb?';d.form='past form?';d.confidence=.52}else if(/(ого|его|ому|ему|ым|им|ой|ей|ую|юю)$/.test(k)){d.pos='adjective/pronoun?';d.confidence=.48}const p=PREFIXES.find(x=>k.startsWith(x)&&k.length>x.length+4);if(p)d.anatomy=[[p,'possible prefix'],[k.slice(p.length),'remaining stem']];return d}function merge(a,b,label){return {...a,...b,source:(a.source||'local')+' + '+label,confidence:Math.max(a.confidence||0,b.confidence||.8)}}function localGuess(w){const k=norm(w);let d=LEX[k]?{...LEX[k],confidence:.95,source:'local DB'}:guessBase(k);if(aiCache[k])d=merge(d,aiCache[k],'AI cache');return d}function materialize(){tokens=source.value.trim().split(/\s+/).filter(Boolean);selected=-1;taps={};render();drawer.innerHTML='<div class="empty">🪆<br><br>左のロシア語から<br>気になる語を押してください。</div>';topFocus.textContent='—';topMeta.textContent='語を押してください';mobilePane('text')}function clickWord(i){selected=i;taps[i]=(taps[i]||0)+1;const s=norm(tokens[i]),d=localGuess(s);speak(s);topFocus.textContent=s;topMeta.textContent=(d.lemma&&d.lemma!==s?'→ '+d.lemma+' · ':'')+(d.pos||'');render();renderDrawer();if(innerWidth<=720&&taps[i]>=2)mobilePane('dive')}function render(){stage.innerHTML='<div class="sentence ru">'+tokens.map((t,i)=>{const d=localGuess(t);return `<button class="token ${selected===i?'on':''} ${d.confidence<.65?'low':''}" onclick="clickWord(${i})">${t}</button>`}).join(' ')+'</div>'}function aspectHTML(d){if(!d.aspect)return'';const lemma=d.lemma||'',imp=d.aspect.impf,pf=d.aspect.pf;return `<div class="panel red"><b>🔄 Aspect</b><div class="aspectPair"><button class="aspectWord ${lemma===imp?'currentSide':''}" onclick="speak('${imp}')">${imp}</button><span>↔</span><button class="aspectWord ${lemma===pf?'currentSide':''}" onclick="speak('${pf}')">${pf}</button></div><div class="small" style="margin-top:7px">📍 今調べている辞書形を少し強く表示しています。</div></div>`}function renderDrawer(){if(selected<0)return;const s=norm(tokens[selected]),d=localGuess(s),depth=taps[selected]||1;let h=`<div class="current"><small>📍 CURRENT ORIGIN</small><strong class="ru">${s}</strong><span class="small">${d.lemma&&d.lemma!==s?'lemma → '+d.lemma:''}</span></div><div class="small">${Math.round((d.confidence||0)*100)}% · ${d.source||'local'} ${d.confidence<.65?'<span class="badge">要確認</span>':''}</div>`;if(depth>=2)h+=`<div class="meaning">${d.jp||'意味未登録'}</div><div class="row"><small>Dictionary form</small><b class="ru">${d.lemma||s}</b></div><div class="row"><small>Part of speech</small><b>${d.pos||'—'}</b></div>${d.form?`<div class="row"><small>Form</small><b>${d.form}</b></div>`:''}${d.case?`<div class="row"><small>📐 Case</small><b>${d.case}</b></div>`:''}${d.governs?`<div class="row"><small>Government</small><b>${d.governs}</b></div>`:''}${d.why?`<div class="panel"><b>📐 Why?</b><p class="small">${d.why}</p></div>`:''}`;if(depth>=3)h+=aspectHTML(d);if(depth>=4&&d.anatomy)h+=`<div class="panel gold"><b>🧬 Word Anatomy</b><div class="parts">${d.anatomy.map((p,i)=>`<button class="part" onclick="anatomyBranch('${p[0]}','${p[1]}')"><small>${p[1]}</small><strong class="ru">${p[0]}</strong></button>`).join('')}</div><div class="branch"><button onclick="branchNote('🧭 Prefix World','同じ接頭辞を持つ語へ横移動します。')">🧭 Prefix</button><button onclick="branchNote('🌱 Root World','同じ語根を持つ語族・派生語へ進みます。')">🌱 Root</button><button onclick="branchNote('⚙️ Suffix Pattern','接尾辞から語形成・Aspect patternを探ります。')">⚙️ Suffix</button></div><div id="branchInfo" class="small" style="margin-top:9px">各部品そのものが分岐駅です。</div></div>`;if(depth>=5&&d.family)h+=`<div class="panel"><b>🌳 Word Family</b><div class="family">${d.family.map(x=>`<button onclick="speak('${x}')">${x}</button>`).join('')}</div></div>`;if(depth>=3)h+=`<div class="panel"><b>🪆 Network branches</b><div class="branch"><button>🧠 Meaning</button><button>⚖️ Contrast</button><button>🧩 Collocation</button><button>🎭 Situation</button><button>📖 Examples</button><button>🗺️ Encounters</button></div></div>`;if(d.confidence<.65&&policy!=='local')h+=`<div class="panel gold"><b>✨ AIが役立ちそうです</b><p class="small">ローカル解析の確信度が低い箇所です。</p></div>`;h+=`<button class="deep" onclick="taps[selected]++;renderDrawer()">さらに深く見る →</button>`;if(depth>=2)h+=`<div class="aiBox"><b>✨ AI refinement（任意）</b><p class="small">必要な時だけJSONで補足できます。</p><textarea id="aiJson" placeholder='{"words":{"${s}":{"jp":"…"}}}'></textarea><button onclick="importAI()">AI解析を追加</button><div id="aiStatus" class="small"></div></div>`;drawer.innerHTML=h}function anatomyBranch(part,type){branchInfo.innerHTML=`<b class="ru">${part}</b> · ${type}<br>📍 ${norm(tokens[selected])} から、この形態素を起点に別方向へ深掘りできます。`}function branchNote(title,text){branchInfo.innerHTML=`<b>${title}</b><br>${text}`}function importAI(){try{const obj=JSON.parse(aiJson.value),words=obj.words||obj;for(const[k,v]of Object.entries(words))aiCache[norm(k)]={...(aiCache[norm(k)]||{}),...v,confidence:v.confidence||.9};localStorage.setItem(AIKEY,JSON.stringify(aiCache));aiStatus.textContent='✓ 保存しました';render();renderDrawer()}catch(e){aiStatus.textContent='JSONを確認してください'}}function mobilePane(p){textPane.classList.toggle('mobileOn',p==='text');divePane.classList.toggle('mobileOn',p==='dive');navText.classList.toggle('on',p==='text');navDive.classList.toggle('on',p==='dive')}materialize();</script></body></html>
