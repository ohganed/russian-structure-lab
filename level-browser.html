<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curriculum · Russian Structure Lab</title><style>:root{--ink:#18211e;--muted:#707773;--paper:#f3f0e8;--cream:#fbfaf6;--green:#285e50;--line:#d8d5cc;--red:#af4b3a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Hiragino Sans",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:42px 22px 70px}a{color:inherit}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.top a{text-decoration:none;font-size:12px;color:var(--green);border:1px solid var(--line);background:var(--cream);padding:10px 14px;border-radius:22px}h1{font:normal clamp(34px,6vw,60px)/1.05 Georgia,serif;margin:22px 0 12px}.lead{color:var(--muted);line-height:1.8}.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:34px 0 22px}.levels button{border:1px solid var(--line);background:var(--cream);padding:15px 6px;font-weight:700}.levels button.on{background:var(--ink);color:#fff}.hero{border:1px solid var(--line);background:var(--cream);padding:25px;margin-bottom:18px}.hero small{letter-spacing:.16em;color:var(--muted)}.hero h2{font:36px Georgia,serif;margin:9px 0}.bar{height:8px;background:#e6e3db;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{border:1px solid var(--line);background:var(--cream);padding:18px;display:flex;justify-content:space-between;gap:15px}.cat b{display:block;margin-bottom:5px}.cat small{color:var(--muted)}.count{font:24px Georgia,serif;white-space:nowrap}.notice{margin-top:22px;padding:18px;border-left:3px solid var(--green);background:#edf0e9;font-size:13px;line-height:1.7}@media(max-width:700px){.levels{grid-template-columns:repeat(3,1fr)}.cats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>🇷🇺 Russian Structure Lab</strong><a href="index.html?screen=learn" onclick="return goLearn(event)">← Learnへ戻る</a></div><h1>📚 A1 → C2</h1><p class="lead">各レベル500文。まだ教材が完成していないレベルも隠さず、現在の状態をそのまま表示します。</p><div class="levels" id="levels"></div><section class="hero"><small>CURRENT LEVEL</small><h2 id="title"></h2><p id="status"></p><div class="bar"><i id="progress"></i></div></section><div class="cats" id="cats"></div><div class="notice" id="notice"></div></div><script src="curriculum.js"></script><script src="materials-a1-calibration.js"></script><script>function goLearn(e){e.preventDefault();window.location.assign(new URL('index.html?screen=learn',window.location.href).href);return false}const C=window.RSL_CURRICULUM;const data=window.RSL_A1_CALIBRATION||[];let level='A1';const icons={A1:'🌱',A2:'🌿',B1:'🌳',B2:'🌲',C1:'🏛️',C2:'🌌'};function count(l,c){return data.filter(x=>x.level===l&&(!c||x.category===c)).length}function render(){levels.innerHTML=C.levels.map(l=>`<button class="${l===level?'on':''}" onclick="level='${l}';render()">${icons[l]} ${l}</button>`).join('');const n=count(level);title.textContent=`${icons[level]} ${level} — ${n} / ${C.perLevel} sentences`;status.textContent=n?`校正教材 ${n}文を登録済み。目標は500文です。`:'このレベルはカリキュラム定義済みですが、教材データはまだ登録されていません。';progress.style.width=`${Math.min(100,n/C.perLevel*100)}%`;cats.innerHTML=C.categories.map(c=>{const k=count(level,c.code);return `<article class="cat"><div><b>${c.emoji} ${c.name}</b><small>${c.code} · target ${c.targetPerLevel}</small></div><span class="count">${k} / ${c.targetPerLevel}</span></article>`}).join('');notice.innerHTML=n?'🪆 <b>教材あり</b> — 現在はA1校正セットを表示しています。今後、品質ゲートを通過した教材から順に500文へ拡張します。':`📍 <b>${level} は見ることができます。</b> ただし現在は 0 / 500 文です。未完成レベルを消したり、押せなくしたりしません。`;}render();</script></body></html>
