name: Validate Russian Materials
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate curriculum data and engine
        run: node tests/validate-materials.cjs
      - name: Validate UI links and shared design
        run: node tests/validate-ui.cjs
