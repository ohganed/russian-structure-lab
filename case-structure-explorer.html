<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Structure Explorer | Russian Structure Lab</title>
<style>
:root{color-scheme:light;--bg:#f3f0e8;--ink:#18211e;--green:#285e50;--line:#d8d5cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.6}main{max-width:760px;margin:auto;padding:22px 16px 60px}a{color:var(--green)}h1{font-size:clamp(25px,5vw,36px);line-height:1.3}section{background:#fbfaf6;border:1px solid var(--line);border-radius:18px;padding:18px;margin:18px 0}.ru{font-size:clamp(24px,5vw,34px);line-height:1.6}button{font:inherit;cursor:pointer;border:1px solid #b8bdb7;background:white;border-radius:12px;padding:12px;min-height:44px}button:disabled{opacity:.6;cursor:default}button:focus-visible{outline:3px solid #b88b26;outline-offset:2px}.choices{display:flex;gap:9px;flex-wrap:wrap}.selected{background:var(--green);color:white}.token{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:5px 4px}.token button{font-size:24px;font-family:Georgia,serif}.token small{font-size:12px;color:#53615b}.muted{color:#58645d}.feedback{min-height:48px;margin-top:12px}.correct{color:#206244}.incorrect{color:#a53d32}.actions{display:flex;gap:8px;flex-wrap:wrap}#progress{font-size:14px;color:#58645d}
</style></head><body><main><a href="index.html">← Learn に戻る</a><h1>📐 Case Structure Explorer</h1><p>単語の形ではなく、文の中での役割から考えます。音声は端末のロシア語音声に依存します。</p>
<section><h2>1. 文の構造</h2><div id="sentence" class="ru" lang="ru"></div><p id="meaning"></p><p id="reason"></p><div class="actions"><button id="listen">🔊 文を聞く</button><button id="next">別の構造を見る →</button></div></section>
<section><h2>2. 格を選ぶ</h2><p id="question" class="ru" lang="ru"></p><div class="choices" id="choices" lang="ru"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="retry">もう一度</button></section>
<p id="progress"></p><p class="muted">教材は確認用の限定例です。ロシア語の全格変化を自動解析する機能ではありません。学習記録や既存教材は変更しません。</p></main>
<script src="case-structure-data.js"></script><script>
(()=>{'use strict';const data=window.RSL_CASE_EXAMPLES||[];let index=0,completed=false;
const el=id=>document.getElementById(id);
function speak(s){if(!('speechSynthesis'in window)){el('feedback').textContent='この端末では音声合成を利用できません。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ru-RU';u.rate=.83;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='ru-ru')||voices.find(v=>v.lang.toLowerCase().startsWith('ru'))||null;if(!u.voice){el('feedback').textContent='ロシア語音声が端末にない場合、発音が不正確になることがあります。'}u.onerror=()=>{el('feedback').textContent='音声を再生できませんでした。端末のロシア語音声設定をご確認ください。'};speechSynthesis.speak(u)}
function render(){const d=data[index];completed=false;el('sentence').replaceChildren();d.tokens.forEach(t=>{const span=document.createElement('span');span.className='token';const b=document.createElement('button');b.textContent=t.word;b.title='音声を聞く: '+t.word;b.addEventListener('click',()=>speak(t.word));const small=document.createElement('small');small.textContent=t.role;span.append(b,small);el('sentence').append(span)});el('meaning').textContent=d.jp;el('reason').textContent=d.reason;el('question').textContent=d.question;el('choices').replaceChildren();d.choices.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.addEventListener('click',()=>answer(i));el('choices').append(b)});el('feedback').textContent='';el('feedback').className='feedback';el('choices').querySelectorAll('button').forEach(b=>b.disabled=false);el('progress').textContent=(index+1)+' / '+data.length+' 構造';}
function answer(i){if(completed)return;const d=data[index],ok=i===d.correct;if(ok)completed=true;el('feedback').className='feedback '+(ok?'correct':'incorrect');el('feedback').textContent=ok?'正解。 '+d.explanation:'もう一度考えましょう。文中の役割と前置詞に注目してください。';[...el('choices').children].forEach((b,j)=>{b.classList.toggle('selected',j===i);b.setAttribute('aria-pressed',String(j===i));if(ok)b.disabled=true})}
el('next').addEventListener('click',()=>{index=(index+1)%data.length;render()});el('retry').addEventListener('click',()=>{render()});el('listen').addEventListener('click',()=>speak(data[index].ru));if(data.length)render();else el('sentence').textContent='教材を読み込めませんでした。';
})();
</script></body></html>
