<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material Engine Self-Test</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif;max-width:900px;margin:auto;padding:32px;background:#f3f0e8;color:#18211e}.ok{color:#17633b}.fail{color:#a23a2c}.card{background:#fff;padding:18px;margin:12px 0;border:1px solid #d8d5cc}code{font-family:ui-monospace,monospace}</style></head><body><h1>🧪 Material Engine Self-Test</h1><div id="out"></div><script src="curriculum.js"></script><script src="materials.js"></script><script src="materials-a1-calibration.js"></script><script src="material-engine.js"></script><script>const out=document.getElementById('out');const tests=[];function t(name,fn){try{const detail=fn();tests.push({name,ok:true,detail})}catch(e){tests.push({name,ok:false,detail:e.message})}}t('Engine loaded',()=>{if(!window.RSL_MATERIAL_ENGINE)throw Error('engine missing');return 'v'+RSL_MATERIAL_ENGINE.version});t('Legacy corpus preserved',()=>{if(!Array.isArray(window.RSL_MATERIALS)||!window.RSL_MATERIALS.length)throw Error('legacy corpus missing');return window.RSL_MATERIALS.length+' source rows'});t('A1 calibration preserved',()=>{if(!Array.isArray(window.RSL_A1_CALIBRATION)||window.RSL_A1_CALIBRATION.length!==50)throw Error('expected 50 A1 calibration rows');return '50 source rows'});t('A1 normalized through engine',()=>{const a=RSL_MATERIAL_ENGINE.getByLevel('A1');if(a.length!==50)throw Error('expected 50 normalized A1 rows, got '+a.length);return a.length+' normalized rows'});t('Legacy remains UNCLASSIFIED',()=>{const s=RSL_MATERIAL_ENGINE.stats();if(!s.levels.UNCLASSIFIED)throw Error('legacy rows were lost or silently reclassified');return s.levels.UNCLASSIFIED+' normalized legacy rows'});t('Stable A1 lookup',()=>{const x=RSL_MATERIAL_ENGINE.getById('A1-DL-001');if(!x||x.ru!=='Я встаю в семь часов.')throw Error('stable ID lookup failed');return x.ru});t('Required modern fields survive normalization',()=>{const x=RSL_MATERIAL_ENGINE.getById('A1-DL-001');for(const k of ['id','level','category','ru','jp','en'])if(!x[k])throw Error('missing '+k);return 'required fields present'});out.innerHTML=tests.map(x=>`<div class="card"><strong class="${x.ok?'ok':'fail'}">${x.ok?'PASS ✅':'FAIL ❌'} — ${x.name}</strong><div><code>${String(x.detail)}</code></div></div>`).join('')+`<h2 class="${tests.every(x=>x.ok)?'ok':'fail'}">${tests.every(x=>x.ok)?'STEP 2 RUNTIME CHECK: PASS':'STEP 2 RUNTIME CHECK: FAIL'}</h2>`;</script></body></html>
