<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morphology Check · Russian Structure Lab</title><style>:root{--i:#18211e;--m:#707773;--p:#f3f0e8;--c:#fbfaf6;--l:#d8d5cc;--g:#285e50;--a:#a98a4e;--r:#af4b3a}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Arial,sans-serif}a{color:inherit;text-decoration:none}header{padding:12px 4vw;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:12px;align-items:center}nav{display:flex;gap:7px;flex-wrap:wrap}nav a{border:1px solid var(--l);background:var(--c);border-radius:18px;padding:8px 10px;font-size:11px}main{width:min(1000px,92vw);margin:auto;padding:32px 0 70px}.hero{text-align:center}.hero h1{font:clamp(38px,6vw,68px)/1 Georgia,serif;margin:10px}.hero p{color:var(--m);line-height:1.7}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}.box,.row{border:1px solid var(--l);background:var(--c);border-radius:18px;padding:16px}.box b{font:34px Georgia,serif;display:block}.box small{color:var(--m)}.list{display:grid;gap:8px;margin-top:16px}.row{display:grid;grid-template-columns:90px 1fr;gap:12px}.PASS{border-left:5px solid var(--g)}.WARN{border-left:5px solid var(--a)}.FAIL{border-left:5px solid var(--r)}.tag{font-weight:700}.meta{color:var(--m);font-size:12px;margin-top:18px}@media(max-width:700px){header{align-items:flex-start}.summary{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero h1{font-size:46px}}</style></head><body><header><a href="index.html"><b>Я Russian Structure Lab</b><br><small>MORPHOLOGY CHECK</small></a><nav><a href="morphology-hub.html">← Hub</a><a href="verb-explorer.html">🧠 Explorer</a></nav></header><main><section class="hero"><div>🧪 DATA CONSISTENCY CHECK</div><h1>Evidence before confidence.</h1><p>Shared curated morphology data の構造矛盾をブラウザ上で確認します。これは linguistic correctness の証明ではなく、内部整合性チェックです。</p></section><div class="summary"><div class="box"><b id="passN">0</b><small>PASS</small></div><div class="box"><b id="warnN">0</b><small>WARN</small></div><div class="box"><b id="failN">0</b><small>FAIL</small></div></div><div id="list" class="list"></div><div class="meta" id="meta"></div></main><script src="morphology-data.js"></script><script>const M=window.RSL_MORPHOLOGY||{entries:{},aliases:{},common:[]},D=M.entries;const out=[];function add(s,k,m){out.push({s,k,m})}for(const [k,x] of Object.entries(D)){const req=['g','a','pair','view','parts','affix','whole','family','ex','c'];const miss=req.filter(r=>x[r]===undefined);if(miss.length)add('FAIL',k,'missing fields: '+miss.join(', '));else add('PASS',k,'required fields present');if(!['impf','pf'].includes(x.a))add('FAIL',k,'invalid aspect: '+x.a);if(!Array.isArray(x.parts)||!x.parts.length)add('FAIL',k,'no anatomy parts');else{const allowed=['prefix','root','root/stem','suffix','stem','stem element','ending'];const bad=x.parts.filter(p=>!Array.isArray(p)||p.length<2||!allowed.includes(p[1]));if(bad.length)add('WARN',k,'unrecognized anatomy labels: '+JSON.stringify(bad))}if(D[x.pair]){if(D[x.pair].pair!==k)add('WARN',k,'pair target exists but is not reciprocal: '+x.pair);else if(D[x.pair].a===x.a)add('FAIL',k,'pair has same aspect: '+x.pair);else add('PASS',k,'reciprocal aspect pair: '+x.pair)}else add('WARN',k,'pair target not yet curated: '+x.pair);if(!Array.isArray(x.ex)||!x.ex.length)add('FAIL',k,'no examples');}for(const [form,target] of Object.entries(M.aliases||{})){if(!D[target])add('FAIL',form,'alias points to missing entry: '+target)}for(const k of M.common||[]){if(!D[k])add('FAIL',k,'common chip points to missing entry')}const c={PASS:0,WARN:0,FAIL:0};out.forEach(x=>c[x.s]++);passN.textContent=c.PASS;warnN.textContent=c.WARN;failN.textContent=c.FAIL;list.innerHTML=out.map(x=>`<div class="row ${x.s}"><div class="tag">${x.s}</div><div><b lang="ru">${x.k}</b><br>${x.m}</div></div>`).join('');meta.textContent=`data ${M.version||'unknown'} · ${M.status||'unknown'} · ${Object.keys(D).length} curated entries · ${Object.keys(M.aliases||{}).length} aliases`;</script></body></html>
